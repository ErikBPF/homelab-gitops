name: validate

# Argo CD auto-syncs main, so a broken manifest merges straight to the cluster.
# This renders every umbrella chart and kubeconforms the output — the CI gate
# the Renovate RFC (desktop-nixos, 2026-07-11) requires before helm/image
# auto-merge.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$archive"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive"
          sudo install kubeconform /usr/local/bin/

      - name: helm template | kubeconform (umbrella charts)
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r chart; do
            dir=$(dirname "$chart")
            echo "::group::$dir"
            if ! helm dependency build "$dir"; then
              echo "::error::helm dependency build failed for $dir"; rc=1
            elif ! helm template "$dir" \
                   | kubeconform -strict -summary -ignore-missing-schemas; then
              rc=1
            fi
            echo "::endgroup::"
          done < <(find platform argocd apps -name Chart.yaml)
          exit $rc

      - name: kubeconform raw manifests (apps / clusters / bootstrap)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            $(find apps clusters bootstrap -name '*.yaml' \
              ! -name Chart.yaml ! -name values.yaml ! -path '*/templates/*' 2>/dev/null)

      - name: Enforce manual sync containment
        run: |
          tests/manual-sync-containment.sh
          tests/airflow-contract.sh

  notify-ci:
    needs: kubeconform
    if: ${{ always() && needs.kubeconform.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify CI channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          CLEYTIN_USER_ID: "1532710143517659356"
        run: |
          if [[ -z "$WEBHOOK" ]]; then echo "::notice::DISCORD_CI_WEBHOOK not configured"; exit 0; fi
          jq -nc --arg cleytin "$CLEYTIN_USER_ID" --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{content:("<@"+$cleytin+">") ,allowed_mentions:{users:[$cleytin]},embeds:[{title:"CI FAILED",description:("**Repository:** `"+$repo+"`\n**Ref:** `"+$ref+"`\n**Actor:** `"+$actor+"`\n[Open workflow]("+$url+")"),color:15548997}]}' |
            curl -fsS -H "Content-Type: application/json" --data @- "$WEBHOOK"

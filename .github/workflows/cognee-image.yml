name: Publish Cognee Falkor image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-cognee-falkor
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse mutable tag overwrite
        run: |
          if docker buildx imagetools inspect ghcr.io/erikbpf/cognee-falkor:1.4.2-adapter0.4.0 >/dev/null 2>&1; then
            echo '::error::Release tag already exists; bump the version instead of overwriting it.'
            exit 1
          fi

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/cognee/image
          file: apps/cognee/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/erikbpf/cognee-falkor:1.4.2-adapter0.4.0
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ErikBPF/homelab-gitops
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and report immutable reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/erikbpf/cognee-falkor@${DIGEST}"
          identity='https://github.com/ErikBPF/homelab-gitops/.github/workflows/cognee-image.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign sign --yes "$ref"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$ref"
          {
            echo '### Pin before Argo sync'
            echo
            echo "\`${ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: langfuse-s3}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: langfuse-s3-auth}
  data:
    - {secretKey: accessKey, remoteRef: {key: lab/langfuse, property: S3_ACCESS_KEY}}
    - {secretKey: secretKey, remoteRef: {key: lab/langfuse, property: S3_SECRET_KEY}}
    - {secretKey: seaweedfs_s3_config, remoteRef: {key: lab/langfuse, property: SEAWEEDFS_S3_CONFIG}}

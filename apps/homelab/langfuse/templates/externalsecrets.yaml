apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: langfuse-app}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: langfuse-app-secrets}
  data:
    - {secretKey: SALT, remoteRef: {key: lab/langfuse, property: SALT}}
    - {secretKey: ENCRYPTION_KEY, remoteRef: {key: lab/langfuse, property: ENCRYPTION_KEY}}
    - {secretKey: NEXTAUTH_SECRET, remoteRef: {key: lab/langfuse, property: NEXTAUTH_SECRET}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: langfuse-postgresql}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: langfuse-postgresql-auth}
  data:
    - {secretKey: POSTGRES_USER, remoteRef: {key: lab/langfuse, property: POSTGRES_USER}}
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: lab/langfuse, property: POSTGRES_PASSWORD}}
    - {secretKey: POSTGRES_DB, remoteRef: {key: lab/langfuse, property: POSTGRES_DB}}
    - {secretKey: USERDB_USER, remoteRef: {key: lab/langfuse, property: USERDB_USER}}
    - {secretKey: USERDB_PASSWORD, remoteRef: {key: lab/langfuse, property: POSTGRES_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

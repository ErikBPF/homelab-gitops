  target: {name: langfuse-redis-auth}
  data:
    - {secretKey: default, remoteRef: {key: lab/langfuse, property: REDIS_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: langfuse-clickhouse}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: langfuse-clickhouse-auth}
  data:

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aster, namespace: aster }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-discovery, kind: ClusterSecretStore }
  target:
    name: aster-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database_url
      remoteRef:
        key: lab/aster
        property: database_url
    - secretKey: session_key
      remoteRef:
        key: lab/aster
        property: session_key
    - secretKey: oidc_client_secret
      remoteRef:
        key: lab/aster
        property: oidc_client_secret

# Staged, source-only. Apply together with
# apps/homelab/aster/authentik-reader-externalsecret.yaml after the
# external-secrets AppRole Secret `vault-approle-aster-authentik-reader` is
# seeded (docs/aster-authentik-reader.md step 3). The deployed chart must not
# carry this store before then: an unseeded store reports
# InvalidProviderConfig and holds the external-secrets Argo application
# Degraded.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-aster-authentik-reader
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    - namespaceRegexes:
        - ^aster$
  provider:
    vault:
      server: "http://100.103.52.100:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: vault-approle-aster-authentik-reader
            key: role_id
            namespace: external-secrets
          secretRef:
            name: vault-approle-aster-authentik-reader
            key: secret_id
            namespace: external-secrets

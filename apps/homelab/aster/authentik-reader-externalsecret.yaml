apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aster-authentik-reader, namespace: aster }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-aster-authentik-reader, kind: ClusterSecretStore }
  target:
    name: aster-authentik-reader-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: authentik_read_token
      remoteRef:
        key: platform/aster/authentik-reader
        property: authentik_read_token

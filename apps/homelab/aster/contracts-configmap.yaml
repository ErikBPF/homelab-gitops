# Contracts are deployment artifacts: change the file, redeploy, restart.
# This is a real Open Data Contract Standard document (v3.2); aster reads
# name/id, team.name, schema[].properties[] and semanticType.
apiVersion: v1
kind: ConfigMap
metadata: { name: aster-contracts, namespace: aster }
data:
  orders.yaml: |
    version: 3.2.0
    apiVersion: v3.2.0
    kind: DataContract
    id: orders
    name: orders
    status: active
    description: one row per customer order
    team:
      name: data-team
    schema:
      - name: orders
        logicalType: object
        properties:
          - name: order_id
            logicalType: bigint
            required: true
            primaryKey: true
          - name: customer_id
            logicalType: bigint
            required: true
            semanticType: dimension
          - name: total
            logicalType: decimal(12,2)
            required: true
            semanticType: measure
          - name: placed_at
            logicalType: timestamp
            required: true
            semanticType: dimension

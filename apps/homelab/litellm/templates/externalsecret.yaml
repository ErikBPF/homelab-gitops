apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: litellm}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: litellm-secrets}
  data:
    - {secretKey: LITELLM_MASTER_KEY, remoteRef: {key: lab/litellm, property: LITELLM_MASTER_KEY}}
    - {secretKey: LITELLM_SALT_KEY, remoteRef: {key: lab/litellm, property: LITELLM_SALT_KEY}}
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: lab/litellm, property: POSTGRES_PASSWORD}}

apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: litellm}
            - {name: POSTGRES_DB, value: litellm}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: litellm-secrets, key: POSTGRES_PASSWORD}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, litellm, -d, litellm]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            # PostgreSQL 18 uses PGDATA=/var/lib/postgresql/18/docker.
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.size | quote }}

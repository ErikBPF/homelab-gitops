apiVersion: v1
kind: ConfigMap
metadata: {name: mcp-echo, namespace: mcp-echo}
data:
  server.py: |
    import argparse
    import json
    import logging
    import sys
    import time
    from http.server import BaseHTTPRequestHandler
    from socketserver import ThreadingTCPServer

    class Handler(BaseHTTPRequestHandler):
        timeout = 10

        def log_message(self, format, *args):
            pass  # Never log bodies or default error messages.

        def parse_request(self):
            parsed = super().parse_request()
            if parsed:
                # Look for X-OpenWebUI identity headers without filtering any others.
                logging.info("%s %s\n%s", self.command, self.path,
                             "\n".join(f"{k}: {v}" for k, v in self.headers.raw_items()))
            return parsed

        def headers_json(self):
            # Ordered pairs preserve repeated names and original casing.
            return list(self.headers.raw_items())

        def reply(self, payload=None, status=200):
            body = json.dumps(payload, indent=2).encode() if payload is not None else b""
            content_type = "application/json"
            accepted = {part.strip().split(";")[0] for part in self.headers.get("Accept", "").split(",")}
            if self.path == "/mcp" and body and "text/event-stream" in accepted and not accepted & {"application/json", "application/*", "*/*"}:
                body = ("event: message\ndata: " + json.dumps(payload) + "\n\n").encode()
                content_type = "text/event-stream"
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            match self.path:
                case "/headers":
                    self.reply(self.headers_json())
                case "/v1/models":
                    self.reply({"object": "list", "data": [{"id": "echo-stub", "object": "model", "created": 0, "owned_by": "mcp-echo"}]})
                case "/mcp":
                    self.reply(status=405)
                case _:
                    self.reply({"error": "Not found"}, 404)

        def do_POST(self):
            if self.path not in ("/mcp", "/v1/chat/completions"):
                return self.reply({"error": "Not found"}, 404)
            try:
                length = int(self.headers.get("Content-Length", "0"))
                if self.headers.get("Transfer-Encoding") or not 0 < length <= 1048576:
                    return self.reply({"error": "Expected JSON body of 1..1048576 bytes"}, 400)
                data = json.loads(self.rfile.read(length))
                if not isinstance(data, dict):
                    return self.reply({"error": "Expected JSON object"}, 400)
            except (ValueError, UnicodeError, TimeoutError):
                return self.reply({"error": "Invalid JSON body"}, 400)
            if self.path == "/v1/chat/completions":
                return self.reply({"id": "chatcmpl-echo", "object": "chat.completion", "created": int(time.time()),
                    "model": data.get("model", "echo-stub"), "choices": [{"index": 0,
                    "message": {"role": "assistant", "content": "echo-stub: headers received"}, "finish_reason": "stop"}],
                    "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}})
            params = data.get("params", {})
            if data.get("jsonrpc") != "2.0" or not isinstance(data.get("method"), str) or not isinstance(params, dict):
                return self.reply({"jsonrpc": "2.0", "id": None, "error": {"code": -32600, "message": "Invalid Request"}}, 400)
            if "id" not in data:
                return self.reply(status=202)
            response = {"jsonrpc": "2.0", "id": data["id"]}
            match data["method"]:
                case "initialize":
                    version = params.get("protocolVersion", "2025-03-26")
                    if version not in ("2025-03-26", "2025-06-18", "2025-11-25"):
                        version = "2025-03-26"
                    response["result"] = {"protocolVersion": version, "capabilities": {"tools": {}},
                                          "serverInfo": {"name": "mcp-echo", "version": "1.0.0"}}
                case "tools/list":
                    response["result"] = {"tools": [{"name": "echo_headers", "description": "Return received HTTP headers",
                        "inputSchema": {"type": "object", "properties": {}, "additionalProperties": False}}]}
                case "tools/call":
                    if params.get("name") != "echo_headers":
                        response["error"] = {"code": -32602, "message": "Unknown tool"}
                    else:
                        response["result"] = {"content": [{"type": "text", "text": json.dumps(self.headers_json(), indent=2)}], "isError": False}
                case _:
                    response["error"] = {"code": -32601, "message": "Method not found"}
            self.reply(response)

    if __name__ == "__main__":
        parser = argparse.ArgumentParser()
        parser.add_argument("--port", type=int, default=8080)
        logging.basicConfig(level=logging.INFO, stream=sys.stdout, format="%(levelname)s %(message)s")
        # TCPServer avoids HTTPServer's startup getfqdn() DNS lookup.
        ThreadingTCPServer.allow_reuse_address = True
        ThreadingTCPServer.daemon_threads = True
        with ThreadingTCPServer(("0.0.0.0", parser.parse_args().port), Handler) as server:
            server.serve_forever()

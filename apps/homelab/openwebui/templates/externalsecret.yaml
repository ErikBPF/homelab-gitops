# Operator creates all four properties in Vault at lab/openwebui before syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: openwebui-app, namespace: openwebui}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-homelab}
  target: {name: openwebui-app-secrets}
  data:
    - {secretKey: OAUTH_CLIENT_ID, remoteRef: {key: lab/openwebui, property: OAUTH_CLIENT_ID}}
    - {secretKey: OAUTH_CLIENT_SECRET, remoteRef: {key: lab/openwebui, property: OAUTH_CLIENT_SECRET}}
    - {secretKey: WEBUI_SECRET_KEY, remoteRef: {key: lab/openwebui, property: WEBUI_SECRET_KEY}}
    - {secretKey: OPENAI_API_KEY, remoteRef: {key: lab/openwebui, property: OPENAI_API_KEY}}

# KEDA cron scale-to-zero: 1 replica 07:00–23:00, 0 overnight (exercises KEDA).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: demo, namespace: demo }
spec:
  scaleTargetRef: { name: demo }
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
    - type: cron
      metadata:
        timezone: America/Sao_Paulo
        start: "0 7 * * *"
        end: "0 23 * * *"
        desiredReplicas: "1"

apiVersion: apps/v1
kind: Deployment
metadata: { name: demo, namespace: demo, labels: { app: demo } }
spec:
  selector: { matchLabels: { app: demo } }
  template:
    metadata: { labels: { app: demo } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: podinfo
          image: harbor.homelab.pastelariadev.com/ghcr/stefanprodan/podinfo:6.7.1@sha256:862ca45e61b32392f7941a1bdfdbe5ff8b6899070135f1bdca1c287d0057fc94
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom: { secretKeyRef: { name: demo-secret, key: message } }
          ports: [{ name: http, containerPort: 9898 }]
          volumeMounts: [{ name: nfs, mountPath: /mnt/nfs }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: nfs
          persistentVolumeClaim: { claimName: demo-data }

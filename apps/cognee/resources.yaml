apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee
  namespace: cognee
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: cognee } }
  template:
    metadata: { labels: { app: cognee } }
    spec:
      imagePullSecrets: [{ name: cognee-harbor }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cognee
          # Built and published by cognee-homelab; GitOps only selects the release tag.
          image: harbor.homelab.pastelariadev.com/library/cognee-homelab@sha256:ba77e587c6c8f2e035fbfc24576c27b22c1fda045cf50cd5beaddd7bf4efbc93
          envFrom:
            - configMapRef: { name: cognee }
            - secretRef: { name: cognee-runtime }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cognee-runtime, key: POSTGRES_PASSWORD } }
            - name: EMBEDDING_API_KEY
              valueFrom: { secretKeyRef: { name: cognee-runtime, key: LLM_API_KEY } }
          ports: [{ name: http, containerPort: 8000 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/cognee }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cognee-data }

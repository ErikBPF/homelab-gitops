apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: cognee
spec:
  serviceName: falkordb
  replicas: 1
  selector: { matchLabels: { app: falkordb } }
  template:
    metadata: { labels: { app: falkordb } }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: falkordb
          image: harbor.homelab.pastelariadev.com/dockerhub/falkordb/falkordb-server:v4.20.3@sha256:aaecf621b52d33aa4946a77b7d6638e709bbb9d4e76220aea115fda117f5ff36
          env:
            - { name: BROWSER, value: "0" }
            - name: REDIS_ARGS
              value: --appendonly yes --appendfsync everysec --save 900 1 --save 300 10
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/falkordb/data }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: falkordb-data }
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: changedetection, namespace: changedetection}
spec:
  ingressClassName: traefik
  rules:
    - host: changedetection.homelab.pastelariadev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: changedetection, port: {number: 80}}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: changedetection
  labels: {app: changedetection}
spec:
  replicas: 1
  selector: {matchLabels: {app: changedetection}}
  template:
    metadata: {labels: {app: changedetection}}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: changedetection
          image: harbor.homelab.pastelariadev.com/ghcr/dgtlmoon/changedetection.io:0.55.7@sha256:736331d2787f94d3201b64aa641e090f67e28577ba505bd7ba5d7c1841e1e0ca
          env:
            - {name: BASE_URL, value: "https://changedetection.homelab.pastelariadev.com"}
          ports: [{name: http, containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /datastore}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: changedetection-data}

apiVersion: v1
kind: Service
metadata: {name: immich-postgres}
spec:
  selector: {app: immich-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: immich-postgres}
spec:
  serviceName: immich-postgres
  replicas: 1
  selector: {matchLabels: {app: immich-postgres}}
  template:
    metadata: {labels: {app: immich-postgres}}
    spec:
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: harbor.homelab.pastelariadev.com/ghcr/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
          env:
            - {name: POSTGRES_USER, value: immich}
            - {name: POSTGRES_DB, value: immich}
            - {name: POSTGRES_INITDB_ARGS, value: --data-checksums}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: immich-secrets, key: DB_PASSWORD}}
          ports: [{name: postgres, containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: [pg_isready, -U, immich, -d, immich]}, initialDelaySeconds: 10}
          livenessProbe: {exec: {command: [pg_isready, -U, immich, -d, immich]}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: immich-postgres}

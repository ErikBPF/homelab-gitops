apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  template:
    spec:
      containers:
        - name: web
          image: harbor.homelab.pastelariadev.com/ghcr/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: chrome}
spec:
  template:
    spec:
      containers:
        - name: chrome
          image: harbor.homelab.pastelariadev.com/ghcr/karakeep-app/karakeep-chrome:release@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
          readinessProbe: {httpGet: {path: /json/version, port: 9222}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /json/version, port: 9222}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: meilisearch}
spec:
  template:
    spec:
      containers:
        - name: meilisearch
          image: harbor.homelab.pastelariadev.com/dockerhub/getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
          readinessProbe: {httpGet: {path: /health, port: 7700}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 7700}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec: {type: ClusterIP}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-pvc}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-fast
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: meilisearch-pvc}
spec:
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: demo, namespace: demo }
spec:
  ingressClassName: nginx
  rules:
    - host: demo.k8s.pastelariadev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: demo, port: { number: 80 } } }

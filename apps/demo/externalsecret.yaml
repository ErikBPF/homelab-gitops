apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: demo, namespace: demo }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-incluster, kind: ClusterSecretStore }
  target:
    name: demo-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: demo
        property: message
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-harbor
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-discovery, kind: ClusterSecretStore }
  target:
    name: airflow-harbor
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: lab/airflow, property: HARBOR_DOCKERCONFIGJSON }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-runtime
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-discovery, kind: ClusterSecretStore }
  target: { name: airflow-runtime, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AIRFLOW_VAR_ENVIRONMENT
      remoteRef: { key: lab/airflow, property: AIRFLOW_VAR_ENVIRONMENT }
    - secretKey: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_CONNECTIONS
      remoteRef: { key: lab/airflow, property: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_CONNECTIONS }
    - secretKey: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_SPARK_CONFIG
      remoteRef: { key: lab/airflow, property: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_SPARK_CONFIG }
    - secretKey: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_EXECUTION
      remoteRef: { key: lab/airflow, property: AIRFLOW_VAR_DATAPLATFORM_DEFAULT_EXECUTION }
    - secretKey: DBT_MANIFEST_CACHE_DIR
      remoteRef: { key: lab/airflow, property: DBT_MANIFEST_CACHE_DIR }
---

# Wave 1: metrics scraper. Makes kube-state-metrics non-inert (grill §8) — scrapes
# KSM + kubelet cAdvisor and remote_writes to discovery's Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/alloy-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

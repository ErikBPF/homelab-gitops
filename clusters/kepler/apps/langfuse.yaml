apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "13"}
spec:
  project: homelab
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/homelab/langfuse
  destination: {server: https://kubernetes.default.svc, namespace: langfuse}
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions: ['.spec.volumeClaimTemplates[]?.status']
  syncPolicy:
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - projects.yaml
  - namespaces.yaml
  - argocd.yaml
  - authentik.yaml
  - cert-manager.yaml
  - changedetection.yaml
  - external-secrets.yaml
  - immich.yaml
  - clickhouse-operator.yaml
  - csi-driver-nfs.yaml
  - keda.yaml
  - traefik.yaml
  - jaeger.yaml
  - karakeep.yaml
  - langfuse.yaml
  - loki.yaml
  - monitoring.yaml
  - scrutiny.yaml
  - spark-operator.yaml
  - yunikorn.yaml
  - kube-state-metrics.yaml
  - alloy-metrics.yaml
  - otel-collector.yaml
  - trace-demo.yaml
  - wazuh.yaml
  - demo.yaml
  - airflow.yaml
  - cognee.yaml

# Every child Application syncs `main` automatically. Main is protected by the
# required kubeconform check and changes only through reviewed PRs; `prune`
# removes resources deleted from git and `selfHeal` reverts out-of-band edits.
patches:
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: automated-sync
      spec:
        syncPolicy:
          automated:
            prune: true
            selfHeal: true

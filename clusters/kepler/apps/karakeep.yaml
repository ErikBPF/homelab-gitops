apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakeep
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "11"}
spec:
  project: home-services
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/home-services/karakeep
  destination: {server: https://kubernetes.default.svc, namespace: karakeep}

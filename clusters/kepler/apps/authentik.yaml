apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "12"}
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/authentik
  destination: {server: https://kubernetes.default.svc, namespace: authentik}
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: authentik-postgresql
      jsonPointers: [/spec/volumeClaimTemplates/0/status]
  syncPolicy:
    syncOptions: [ServerSideApply=true]

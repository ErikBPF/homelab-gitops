apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/authentik
  destination: {server: https://kubernetes.default.svc, namespace: authentik}
  syncPolicy:
    syncOptions: [ServerSideApply=true]

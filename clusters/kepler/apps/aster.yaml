# Wave 4: aster — SSO SQL notebooks over the Trino pool, git-backed cells, Polaris catalog.
# Prerequisite: proposal D6 (Trino/Polaris/gateway runtime) and the published Harbor image.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: aster, namespace: argocd, annotations: { argocd.argoproj.io/sync-wave: "4" } }
spec:
  project: homelab
  source: { repoURL: "ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git", targetRevision: main, path: apps/homelab/aster }
  destination: { server: https://kubernetes.default.svc, namespace: aster }
  syncPolicy:
    syncOptions: [ServerSideApply=true]

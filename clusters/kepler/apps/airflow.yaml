apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/airflow
    helm:
      releaseName: airflow
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  ignoreDifferences:
    - kind: PersistentVolumeClaim
      name: airflow-dags
      namespace: airflow
      jsonPointers:
        - /spec/volumeName
    - kind: PersistentVolumeClaim
      name: airflow-logs
      namespace: airflow
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

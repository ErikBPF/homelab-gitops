apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: uptime-kuma, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "6"}}
spec:
  project: platform
  source: {repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git, targetRevision: main, path: platform/uptime-kuma}
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy: {syncOptions: [CreateNamespace=true]}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "14"}
spec:
  project: homelab
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/homelab/litellm
  destination: {server: https://kubernetes.default.svc, namespace: litellm}
  # The API server defaults apiVersion/kind/volumeMode inside volumeClaimTemplates;
  # without this the postgres StatefulSet stays permanently OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]

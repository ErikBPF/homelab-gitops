apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: trino-gateway, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "2"}}
spec:
  project: platform
  source: {repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git, targetRevision: main, path: platform/trino-gateway}
  destination: {server: https://kubernetes.default.svc, namespace: trino}
  syncPolicy: {syncOptions: [ServerSideApply=true]}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: spark-connect, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "2"}}
spec:
  project: platform
  source: {repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git, targetRevision: main, path: platform/spark-connect}
  destination: {server: https://kubernetes.default.svc, namespace: spark-jobs}
  syncPolicy:
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]

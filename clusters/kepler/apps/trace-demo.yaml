# Wave 2: synthetic trace producer for the OTel→Jaeger pipeline (grill §8).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trace-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/homelab/trace-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: trace-demo

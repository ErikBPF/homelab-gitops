apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-echo
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "15"}
spec:
  project: homelab
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/homelab/mcp-echo
  destination: {server: https://kubernetes.default.svc, namespace: mcp-echo}
  syncPolicy:
    syncOptions: [ServerSideApply=true]

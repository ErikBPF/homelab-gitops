apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "12"}
spec:
  project: home-services
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: apps/home-services/immich
  destination: {server: https://kubernetes.default.svc, namespace: immich}
  syncPolicy:
    syncOptions: [ServerSideApply=true]

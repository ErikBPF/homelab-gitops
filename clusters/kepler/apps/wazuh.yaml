apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: wazuh, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "7"}}
spec:
  project: platform
  source: {repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git, targetRevision: main, path: platform/wazuh}
  destination: {server: https://kubernetes.default.svc, namespace: wazuh}
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions: ['.spec.volumeClaimTemplates[]?.status']
  syncPolicy: {syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]}

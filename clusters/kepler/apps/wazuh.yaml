apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: wazuh, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "7"}}
spec:
  project: platform
  source: {repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git, targetRevision: main, path: platform/wazuh}
  destination: {server: https://kubernetes.default.svc, namespace: wazuh}
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.spec.serviceAccount
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
    # The bounded backup controller owns temporary scale-to-zero and rescue-to-one.
    # Never ignore indexer replicas, other workloads, or any manager field besides replicas.
    - group: apps
      kind: StatefulSet
      name: wazuh-manager-master
      namespace: wazuh
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: StatefulSet
      name: wazuh-manager-worker
      namespace: wazuh
      jsonPointers: [/spec/replicas]
  syncPolicy: {syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]}

# Wave -1: ingress. Cutover complete — ingress-nginx is removed from the Nix
# autoDeployCharts, every Ingress uses ingressClassName: traefik, and the kepler
# L4 LB fronts traefik's NodePort 30444 (`traefikIngressPort` in desktop-nixos).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Traefik ships CRDs

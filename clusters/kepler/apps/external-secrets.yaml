# Wave -3: secrets first — other components pull creds from Vault@discovery.
# PREREQ: Vault stack on discovery (AppRole) + vault-approle secret seeded by
# sops-nix on kepler + ACL grant kepler->discovery:8200 (homelab-iac).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: git@github.com:ErikBPF/homelab-gitops.git
    targetRevision: main
    path: platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # ESO ships large CRDs

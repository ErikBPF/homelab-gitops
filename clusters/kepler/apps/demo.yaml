# Wave 3: flagship demo — exercises Vault(ESO)+NFS+ingress+KEDA+restricted-PSA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: demo, namespace: argocd, annotations: { argocd.argoproj.io/sync-wave: "3" } }
spec:
  project: default
  source: { repoURL: "ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git", targetRevision: main, path: apps/demo }
  destination: { server: https://kubernetes.default.svc, namespace: demo }
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

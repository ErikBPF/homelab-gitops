# Argo adopts its own release (helm-installed by `just bootstrap`), so upgrades
# become a committed version bump in argocd/Chart.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/ErikBPF/platform-gitops.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never prune Argo's own resources
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

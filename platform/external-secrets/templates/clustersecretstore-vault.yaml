# In-cluster Vault via AppRole over cluster DNS (no tailnet/ACL). roleId is
# non-secret (inline); secret_id is the vault-approle Secret (seeded out-of-band).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-incluster
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after ESO CRDs
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "c0882698-15ab-9352-6c48-901156236acf"
          secretRef:
            name: vault-approle
            key: secret_id
            namespace: external-secrets

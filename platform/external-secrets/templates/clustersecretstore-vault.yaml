# Platform OpenBao on discovery (the always-on home host), reached over the
# tailnet — NOT the in-cluster vault (dropped in P3.1b). Pods can't resolve
# MagicDNS, so the raw tailnet IP is used (same as alloy-metrics → discovery).
# Reach is gated by the tailnet ACL (kepler → discovery:8200) + discovery's
# tailscale0 firewall. roleId is non-secret (inline); secret_id is the
# vault-approle Secret (seeded out-of-band). No TLS: WireGuard encrypts the
# transport (see desktop-nixos RFC P3.1b).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-discovery
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after ESO CRDs
spec:
  provider:
    vault:
      server: "http://100.103.52.100:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "61e40e0b-a0ca-dfc7-5bf1-507c74e9f08c"
          secretRef:
            name: vault-approle
            key: secret_id
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    - namespaceRegexes:
        - ^(argocd|authentik|cert-manager|clickhouse-operator|external-secrets|keda|kube-system|monitoring|observability|traefik|wazuh)$
  provider:
    vault:
      server: "http://100.103.52.100:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: vault-approle-platform
            key: role_id
            namespace: external-secrets
          secretRef:
            name: vault-approle-platform
            key: secret_id
            namespace: external-secrets
---

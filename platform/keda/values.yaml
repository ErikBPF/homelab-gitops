# Lab sizing. Use cases: cron scaler (scale-to-zero idle apps) + prometheus
# scaler against discovery's external Prometheus (needs a TriggerAuthentication
# per ScaledObject). CPU/mem scalers wrap the k3s-bundled metrics-server.
keda:
  priorityClassName: homelab-platform-critical
  global:
    image:
      registry: harbor.homelab.pastelariadev.com/ghcr
  image:
    keda:
      tag: 2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809
    metricsApiServer:
      tag: 2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881
    webhooks:
      tag: 2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1
  resources:
    operator:
      requests: { cpu: 10m, memory: 64Mi }
    metricServer:
      requests: { cpu: 10m, memory: 64Mi }
    webhooks:
      requests: { cpu: 10m, memory: 32Mi }

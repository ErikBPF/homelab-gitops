# Lab sizing. Use cases: cron scaler (scale-to-zero idle apps) + prometheus
# scaler against discovery's external Prometheus (needs a TriggerAuthentication
# per ScaledObject). CPU/mem scalers wrap the k3s-bundled metrics-server.
keda:
  priorityClassName: homelab-platform-critical
  global:
    image:
      registry: harbor.homelab.pastelariadev.com/ghcr
  image:
    keda:
      tag: 2.20.2@sha256:fe74c7b8849586a67ad2201bcb89e7f5ac221ff90399ecaa8fd28427f1ef11e6
    metricsApiServer:
      tag: 2.20.2@sha256:27286536a8a775aeeee37a7e343f8ecebb27ebf680ee1181a4f99e82eefb253b
    webhooks:
      tag: 2.20.2@sha256:41f74102aba7959c6e8d08b433ab8a5fd6cae7c5646c78f7fe3de40a52df3439
  resources:
    operator:
      requests: { cpu: 10m, memory: 64Mi }
    metricServer:
      requests: { cpu: 10m, memory: 64Mi }
    webhooks:
      requests: { cpu: 10m, memory: 32Mi }

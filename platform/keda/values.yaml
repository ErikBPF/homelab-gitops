# Lab sizing. Use cases: cron scaler (scale-to-zero idle apps) + prometheus
# scaler against discovery's external Prometheus (needs a TriggerAuthentication
# per ScaledObject). CPU/mem scalers wrap the k3s-bundled metrics-server.
keda:
  priorityClassName: homelab-platform-critical
  global:
    image:
      registry: harbor.homelab.pastelariadev.com/ghcr
  image:
    keda:
      tag: 2.21.1@sha256:d09d92c0a310e3057a3c54df387b99abf2bf31352218dbe1adcb00e807886488
    metricsApiServer:
      tag: 2.21.1@sha256:747e376b3e80dc4f72bf4f7043f47cc4cdb56f34b1aed9531789f474996e1c84
    webhooks:
      tag: 2.21.1@sha256:5f4b0b0f7831b9f53738be85e99449a1747a5effa970305fe602455ab0f4fcd3
  resources:
    operator:
      requests: { cpu: 10m, memory: 64Mi }
    metricServer:
      requests: { cpu: 10m, memory: 64Mi }
    webhooks:
      requests: { cpu: 10m, memory: 32Mi }

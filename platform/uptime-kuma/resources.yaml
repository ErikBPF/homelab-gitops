apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uptime-kuma-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-slow
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: uptime-kuma, labels: {app: uptime-kuma}}
spec:
  replicas: 1
  selector: {matchLabels: {app: uptime-kuma}}
  template:
    metadata: {labels: {app: uptime-kuma}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: uptime-kuma
          image: harbor.homelab.pastelariadev.com/dockerhub/louislam/uptime-kuma:2.5.0@sha256:a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
          ports: [{name: http, containerPort: 3001}]
          volumeMounts: [{name: data, mountPath: /app/data}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: uptime-kuma-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: uptime-kuma}
spec:
  selector: {app: uptime-kuma}
  ports: [{name: http, port: 3001, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: uptime-kuma}
spec:
  ingressClassName: traefik
  rules:
    - host: uptime-kuma.homelab.pastelariadev.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: uptime-kuma, port: {number: 3001}}}}]

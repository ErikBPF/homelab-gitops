# Fast + slow NFS, both backed by kepler at its br-k3s gateway IP 10.250.0.1.
# fast-pool (SSD RAIDZ1) → /fast/k8s ; bulk-pool (HDD) → /bulk/k8s. Exports added
# in desktop-nixos modules/hosts/kepler/nas.nix (rw to 10.250.0.0/24).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-fast
provisioner: nfs.csi.k8s.io
parameters:
  server: "10.250.0.1"
  share: "/fast/k8s" # fast-pool SSD
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-slow
provisioner: nfs.csi.k8s.io
parameters:
  server: "10.250.0.1"
  share: "/bulk/k8s" # bulk-pool HDD
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime

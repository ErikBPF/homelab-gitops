# Harbor admin password sourced from Vault (secret/harbor) — replaces the
# out-of-band kubectl Secret. ESO owns harbor-admin-secret now.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-incluster
    kind: ClusterSecretStore
  target:
    name: harbor-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: harbor
        property: HARBOR_ADMIN_PASSWORD

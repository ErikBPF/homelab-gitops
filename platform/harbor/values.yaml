# Lab-slimmed Harbor: PVCs on nfs-fast, Trivy OFF (lab weight; flip on to mimic
# prod scanning). Admin password comes from an out-of-band Secret (NEVER in git);
# migrate to ESO once Vault@discovery is up. Ingress on the nginx class so it's
# reachable via the existing kepler L4 LB (.250 -> ingress-nginx 30443) + the
# *.k8s wildcard — Traefik (the eventual default) isn't behind the LB until the
# §14 cutover, so a traefik-class ingress would be unreachable today.
harbor:
  externalURL: https://harbor.k8s.pastelariadev.com

  expose:
    type: ingress
    tls:
      enabled: false # terminated upstream (kepler L4 LB / SWAG)
    ingress:
      hosts:
        core: harbor.k8s.pastelariadev.com
      className: nginx

  # Admin password from a Secret created out-of-band (kubectl, strong random) —
  # not committed. existingSecret takes effect on a fresh DB init.
  existingSecretAdminPassword: harbor-admin-secret
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

  trivy:
    enabled: false # lab weight; flip on to mimic prod image scanning

  persistence:
    enabled: true
    persistentVolumeClaim:
      registry:
        storageClass: nfs-fast
        size: 20Gi
      jobservice:
        jobLog:
          storageClass: nfs-fast
          size: 1Gi
      database:
        storageClass: nfs-fast
        size: 2Gi
      redis:
        storageClass: nfs-fast
        size: 1Gi

  # Lab sizing — single replicas, small requests.
  core:
    resources:
      requests: { cpu: 25m, memory: 128Mi }
  registry:
    registry:
      resources:
        requests: { cpu: 25m, memory: 128Mi }
  database:
    internal:
      resources:
        requests: { cpu: 25m, memory: 128Mi }
  redis:
    internal:
      resources:
        requests: { cpu: 10m, memory: 32Mi }

# UniFi API key from OpenBao (secret/platform/unifi, field api_key). The
# platform ESO AppRole already grants read on secret/data/platform/*, so this
# needs no Vault policy change. Only the one field is copied into the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: unpoller}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-platform}
  target: {name: unpoller}
  data:
    - secretKey: api_key
      remoteRef: {key: platform/unifi, property: api_key}

# kube-prometheus-stack sets serviceMonitorSelectorNilUsesHelmValues: true, so
# Prometheus selects ServiceMonitors labelled `release: monitoring` in the
# `monitoring` namespace. Metric names use the `unifi_` namespace set in the
# Deployment; see docs/unpoller-metrics.md for the inventory.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
  labels: {release: monitoring, app: unpoller}
spec:
  selector:
    matchLabels: {app: unpoller}
  endpoints:
    - {port: http, path: /metrics, interval: 60s}

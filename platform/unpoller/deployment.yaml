# UniFi Prometheus exporter (unpoller). Metrics-only: the InfluxDB output is
# disabled, so Prometheus is the single sink. ServiceMonitor (same namespace)
# carries the `release: monitoring` label the wrapper chart selects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels: {app: unpoller}
spec:
  replicas: 1
  selector: {matchLabels: {app: unpoller}}
  template:
    metadata: {labels: {app: unpoller}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      hostAliases:
        - {ip: "192.168.10.1", hostnames: ["unifi.local"]}
      volumes:
        - name: unifi-controller-ca
          configMap: {name: unifi-controller-ca}
      containers:
        - name: unpoller
          image: harbor.homelab.pastelariadev.com/ghcr/unpoller/unpoller:v2.34.0@sha256:73423ddfe304e866b2cda2d3ecf8e68c15317c93a22945ad7d941d3ca3a6d022
          env:
            # The controller certificate is CN=unifi.local with no address SAN
            # for 192.168.10.1, so the exporter reaches the gateway by that name
            # (hostAlias below) and verifies it against the pinned certificate.
            - {name: UP_UNIFI_DEFAULT_URL, value: "https://unifi.local"}
            - {name: UP_UNIFI_DEFAULT_VERIFY_SSL, value: "true"}
            # Go reads SSL_CERT_FILE as the trust store; it replaces the system
            # pool, which is fine because this pod talks to the controller only.
            - {name: SSL_CERT_FILE, value: "/etc/ssl/unifi/unifi.local.pem"}
            - {name: UP_UNIFI_DEFAULT_SAVE_SITES, value: "true"}
            - {name: UP_INFLUXDB_DISABLE, value: "true"}
            - {name: UP_PROMETHEUS_NAMESPACE, value: "unifi"}
            - {name: UP_PROMETHEUS_HTTP_LISTEN, value: "0.0.0.0:9130"}
            - name: UP_UNIFI_DEFAULT_API_KEY
              valueFrom: {secretKeyRef: {name: unpoller, key: api_key}}
          ports: [{name: http, containerPort: 9130}]
          volumeMounts:
            - {name: unifi-controller-ca, mountPath: /etc/ssl/unifi, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: unpoller, labels: {app: unpoller}}
spec:
  selector: {app: unpoller}
  ports: [{name: http, port: 9130, targetPort: http}]

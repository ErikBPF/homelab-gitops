# Traefik is the cluster default ingress; ingress-nginx is gone (removed from the
# Nix autoDeployCharts). The kepler L4 LB fronts the traefik NodePort 30444
# (`traefikIngressPort` in desktop-nixos), so that port is permanent — do not
# "flip back" to 30443. Every Ingress in this repo uses ingressClassName: traefik.
# PSA baseline: Traefik runs non-root + drops caps by default → baseline-clean.
traefik:
  image:
    registry: harbor.homelab.pastelariadev.com
    repository: dockerhub/library/traefik
    # Keep in step with the chart's appVersion (42.3.0 -> v3.7.17); the
    # chart-image-parity contract fails a chart bump without this pin.
    tag: v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
  priorityClassName: homelab-platform-critical
  deployment:
    replicas: 1 # lab; bump for HA later

  ingressClass:
    enabled: true
    isDefaultClass: true # cutover: default ingress (on 30444, LB-fronted)

  providers:
    kubernetesCRD:
      enabled: true # IngressRoute/Middleware CRDs (prod-mimic)
    kubernetesIngress:
      enabled: true # plain Ingress objects too

  service:
    type: NodePort

  ports:
    web:
      nodePort: 30081 # phase 1 (cutover → 30080)
    websecure:
      nodePort: 30444 # phase 1 (cutover → 30443, behind the L4 LB)

  resources:
    requests: { cpu: 25m, memory: 64Mi }

  # Prometheus metrics are on by default in this chart; expose them on a
  # dedicated ClusterIP metrics Service (:9100) so alloy-metrics can scrape them
  # → discovery Prometheus (telemetry RFC). addRoutersLabels enriches per-router
  # request/latency series for the Traefik dashboard.
  metrics:
    prometheus:
      addRoutersLabels: true
      service:
        enabled: true

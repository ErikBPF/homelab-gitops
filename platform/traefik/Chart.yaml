apiVersion: v2
name: traefik
description: Traefik ingress controller — replaces ingress-nginx as the cluster default
version: 0.1.0
dependencies:
  # Traefik split CRDs into a separate chart at v3x/chart-41 — both needed for
  # IngressRoute/Middleware (the prod-mimic value), not just plain Ingress.
  - name: traefik-crds
    version: 1.18.0 # Renovate-managed
    repository: https://traefik.github.io/charts
  - name: traefik
    version: 41.2.0 # Renovate-managed (traefik.github.io/charts)
    repository: https://traefik.github.io/charts

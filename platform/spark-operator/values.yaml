spark-operator:
  image:
    registry: harbor.homelab.pastelariadev.com/ghcr
    repository: kubeflow/spark-operator/controller
    tag: 2.5.2@sha256:57e146696e49ea1ef3cc199097dabff3d570d9638dc33155b9170293081c49c7
  controller:
    batchScheduler: {enable: true, default: yunikorn}
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 500m, memory: 1Gi}
  spark:
    jobNamespaces: [spark-jobs]
  webhook:
    enable: true
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}

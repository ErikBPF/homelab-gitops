apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: healthchecks}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-platform}
  target: {name: healthchecks-secrets}
  dataFrom: [{extract: {key: platform/healthchecks}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: healthchecks-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: healthchecks, labels: {app: healthchecks}}
spec:
  replicas: 1
  selector: {matchLabels: {app: healthchecks}}
  template:
    metadata: {labels: {app: healthchecks}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: healthchecks
          image: lscr.io/linuxserver/healthchecks:4.2.20260708@sha256:4cb0891d82d4a085eaeedd09f06ad9063e078587afdcfef0ad7ea61d53a97664
          envFrom: [{secretRef: {name: healthchecks-secrets}}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Sao_Paulo}
            - {name: SITE_ROOT, value: "https://healthchecks.homelab.pastelariadev.com"}
            - {name: SITE_NAME, value: "Homelab Healthchecks"}
            - {name: ALLOWED_HOSTS, value: "healthchecks.homelab.pastelariadev.com,localhost,127.0.0.1"}
            - {name: REGISTRATION_OPEN, value: "False"}
          ports: [{name: http, containerPort: 8000}]
          volumeMounts: [{name: data, mountPath: /config}]
          readinessProbe: {httpGet: {path: /, port: http, httpHeaders: [{name: Host, value: healthchecks.homelab.pastelariadev.com}]}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /, port: http, httpHeaders: [{name: Host, value: healthchecks.homelab.pastelariadev.com}]}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: healthchecks-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: healthchecks}
spec:
  selector: {app: healthchecks}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: healthchecks}
spec:
  ingressClassName: traefik
  rules:
    - host: healthchecks.homelab.pastelariadev.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: healthchecks, port: {number: 8000}}}}]

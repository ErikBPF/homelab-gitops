vcluster:
  sync:
    toHost:
      ingresses:
        enabled: true
      networkPolicies:
        enabled: true
      pods:
        useSecretsForSATokens: true
    fromHost:
      ingressClasses:
        enabled: true

  policies:
    podSecurityStandard: restricted
    resourceQuota:
      enabled: true
      quota:
        requests.cpu: 1500m
        requests.memory: 6Gi
        limits.cpu: "3"
        limits.memory: 8Gi
        services.loadbalancers: "0"
        services.nodeports: "0"
        count/pods: "30"
    limitRange:
      enabled: true
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
    networkPolicy:
      enabled: true

  controlPlane:
    statefulSet:
      image:
        repository: loft-sh/vcluster-oss
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

  exportKubeConfig:
    context: pastelariadev

  telemetry:
    enabled: false

  experimental:
    deploy:
      vcluster:
        manifests: |-
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: harbor-pull-smoke
            namespace: default
          spec:
            activeDeadlineSeconds: 120
            backoffLimit: 2
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: harbor-pull-smoke
              spec:
                automountServiceAccountToken: false
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: pull
                    image: harbor.homelab.pastelariadev.com/dockerhub/library/busybox:1.37.0
                    command: ["sh", "-c", "echo harbor-pull-ok"]
                    resources:
                      requests:
                        cpu: 5m
                        memory: 8Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true

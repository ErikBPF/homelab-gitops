# Lab sizing — tiny requests.
kube-state-metrics:
  image:
    registry: harbor.homelab.pastelariadev.com
    repository: k8s/kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  # No in-cluster Prometheus — a scraper (cluster Alloy) remote_writes to discovery.
  # Annotations left for whatever scrape mechanism you wire up.
  prometheus:
    monitor:
      enabled: false # no Prometheus Operator here

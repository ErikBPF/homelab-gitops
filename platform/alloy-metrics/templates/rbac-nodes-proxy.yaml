# The alloy chart's default RBAC covers discovery (nodes/pods/services list+watch)
# but not nodes/proxy, which the cAdvisor-via-apiserver-proxy scrape needs. Grant
# it explicitly to the alloy-metrics SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics-nodes-proxy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics-nodes-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics-nodes-proxy
subjects:
  - kind: ServiceAccount
    name: alloy-metrics
    namespace: monitoring

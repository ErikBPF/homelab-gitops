# Chart RBAC covers namespaced service discovery. This separate role preserves
# node discovery and the current API proxy scrape. The proxy grant remains
# powerful until direct kubelet metrics and trusted TLS are proven together.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics-nodes-proxy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics-nodes-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics-nodes-proxy
subjects:
  - kind: ServiceAccount
    name: alloy-metrics
    namespace: monitoring

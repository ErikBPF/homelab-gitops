# Single-replica Deployment (NOT a DaemonSet): KSM is a cluster singleton (scrape
# once, not N×), and one pod scrapes every node's kubelet cAdvisor via the
# apiserver proxy. Distinct release/SA ("alloy-metrics") from the log DaemonSet
# ("alloy", Nix). Remote write stays inside the cluster.
alloy:
  image:
    registry: harbor.homelab.pastelariadev.com/dockerhub
    digest: sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
  configReloader:
    image:
      registry: harbor.homelab.pastelariadev.com/quay

  controller:
    type: deployment
    replicas: 1

  serviceAccount:
    create: true
    name: alloy-metrics # deterministic, for the nodes/proxy ClusterRoleBinding

  alloy:
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 512Mi }
    livenessProbe:
      httpGet:
        path: /-/ready
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    configMap:
      content: |
        // ── kube-state-metrics: cluster object/health state (scraped once) ──
        prometheus.scrape "ksm" {
          targets = [{
            "__address__" = "kube-state-metrics.monitoring.svc.cluster.local:8080",
            "job"         = "kube-state-metrics",
          }]
          scrape_interval = "60s"
          sample_limit    = 15000
          forward_to      = [prometheus.remote_write.discovery.receiver]
        }

        // ── per-node kubelet cAdvisor via the apiserver proxy (needs nodes/proxy) ──
        discovery.kubernetes "nodes" {
          role = "node"
        }
        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
        }
        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.cadvisor.output
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config { insecure_skip_verify = true }
          scrape_interval   = "60s"
          sample_limit      = 25000
          forward_to        = [prometheus.remote_write.discovery.receiver]
        }

        // ── per-node kubelet own /metrics via the same apiserver proxy ──
        // Adds kubelet_volume_stats_* (PVC usage) which cAdvisor doesn't expose.
        // Keep-filtered hard so remote_write volume stays sane.
        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/${1}/proxy/metrics"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
        }
        prometheus.scrape "kubelet" {
          targets           = discovery.relabel.kubelet.output
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config { insecure_skip_verify = true }
          scrape_interval   = "60s"
          forward_to        = [prometheus.relabel.kubelet_keep.receiver]
        }
        prometheus.relabel "kubelet_keep" {
          rule {
            source_labels = ["__name__"]
            // PLEG histogram buckets dropped (14 buckets/node, nothing
            // consumes them); re-add _sum|_count if a latency panel appears.
            regex         = "kubelet_volume_stats_.*|kubelet_running_.*|kubelet_node_name"
            action        = "keep"
          }
          forward_to = [prometheus.remote_write.discovery.receiver]
        }

        // ── Traefik: scrape the dedicated metrics Service in ns "traefik" ──
        // Service-discovery (not hardcoded DNS) so it tracks the chart's service
        // name; keep only the port named "metrics" (:9100).
        discovery.kubernetes "traefik" {
          role = "service"
          namespaces { names = ["traefik"] }
        }
        discovery.relabel "traefik" {
          targets = discovery.kubernetes.traefik.targets
          rule {
            source_labels = ["__meta_kubernetes_service_port_name"]
            regex         = "metrics"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            target_label  = "service"
          }
        }
        prometheus.scrape "traefik" {
          targets         = discovery.relabel.traefik.output
          job_name        = "traefik"
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.discovery.receiver]
        }

        // ── Argo CD application-controller: GitOps app health/sync state ──
        // Service "argocd-application-controller-metrics" (:8082, port
        // "http-metrics") — enabled via argo-cd.controller.metrics.enabled in
        // argocd/values.yaml. Keep-filtered to the app/cluster health series.
        discovery.kubernetes "argocd" {
          role = "service"
          namespaces { names = ["argocd"] }
        }
        discovery.relabel "argocd" {
          targets = discovery.kubernetes.argocd.targets
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            regex         = "argocd-application-controller-metrics"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_port_name"]
            regex         = "http-metrics"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            target_label  = "service"
          }
        }
        prometheus.scrape "argocd" {
          targets         = discovery.relabel.argocd.output
          job_name        = "argocd"
          scrape_interval = "60s"
          forward_to      = [prometheus.relabel.argocd_keep.receiver]
        }
        prometheus.relabel "argocd_keep" {
          rule {
            source_labels = ["__name__"]
            // health/sync signal only: app_info carries health_status +
            // sync_status as labels (the standalone health metric was removed
            // upstream); the per-verb k8s/git/redis request counters were
            // ~100-200 unused series remote_written cross-host.
            regex         = "argocd_app_info|argocd_app_sync_total|argocd_cluster_connection_status"
            action        = "keep"
          }
          forward_to = [prometheus.remote_write.discovery.receiver]
        }

        // ── embedded etcd: direct control-plane metrics on the private VM LAN ──
        // k3s exposes unauthenticated metrics only on :2381 inside br-k3s.
        // Static targets are intentional: the three control-plane addresses are
        // fixed substrate owned by desktop-nixos, not Kubernetes Services.
        prometheus.scrape "etcd" {
          targets = [
            { "__address__" = "10.250.0.11:2381", "instance" = "cp-1" },
            { "__address__" = "10.250.0.12:2381", "instance" = "cp-2" },
            { "__address__" = "10.250.0.13:2381", "instance" = "cp-3" },
          ]
          job_name        = "etcd"
          scrape_interval = "30s"
          scrape_timeout  = "10s"
          forward_to      = [prometheus.relabel.etcd_keep.receiver]
        }
        prometheus.relabel "etcd_keep" {
          rule {
            source_labels = ["__name__"]
            // Quorum, leader churn, DB growth, fsync and peer latency: enough
            // to diagnose control-plane health without shipping every series.
            regex  = "up|etcd_server_has_leader|etcd_server_is_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_(applied_total|committed_total|failed_total|pending)|etcd_mvcc_db_total_size_in_(bytes|use_in_bytes)|etcd_disk_(backend_commit|wal_fsync)_duration_seconds_(bucket|sum|count)|etcd_network_peer_round_trip_time_seconds_(bucket|sum|count)|process_resident_memory_bytes"
            action = "keep"
          }
          forward_to = [prometheus.remote_write.discovery.receiver]
        }

        // ── Alloy's own remote-write health, kept narrow for alerting ──
        prometheus.scrape "alloy" {
          targets = [{
            "__address__" = "127.0.0.1:12345",
            "instance"    = "alloy-metrics",
          }]
          job_name        = "alloy-metrics"
          scrape_interval = "30s"
          forward_to      = [prometheus.relabel.alloy_keep.receiver]
        }
        prometheus.relabel "alloy_keep" {
          rule {
            source_labels = ["__name__"]
            regex         = "up|prometheus_remote_storage_samples_pending|prometheus_remote_storage_samples_retried_total"
            action        = "keep"
          }
          forward_to = [prometheus.remote_write.discovery.receiver]
        }

        prometheus.remote_write "discovery" {
          endpoint {
            url = "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            queue_config {
              sample_age_limit = "30m"
            }
          }
          external_labels = { "cluster" = "homelab" }
        }

# Lab Vault: standalone, file storage on local-path (node-local — single writer,
# no NFS-file-lock risk), HTTP (cluster-internal; ESO reaches it over cluster DNS,
# no tailnet/ACL). Manual init+unseal (1 key-share for the lab); re-unseal on pod
# restart, or wire auto-unseal later. Injector off — ESO is the only consumer.
vault:
  injector:
    enabled: false
  ui:
    enabled: true
  server:
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          address     = "[::]:8200"
          tls_disable = 1
        }
        storage "file" {
          path = "/vault/data"
        }
    dataStorage:
      enabled: true
      storageClass: local-path
      size: 1Gi
    ha:
      enabled: false
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

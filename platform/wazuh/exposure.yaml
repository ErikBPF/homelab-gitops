apiVersion: v1
kind: Service
metadata: {name: wazuh-agent-ingest}
spec:
  type: NodePort
  selector: {app: wazuh-manager, node-type: worker}
  ports:
    - {name: agents-events, protocol: TCP, port: 1514, targetPort: 1514, nodePort: 31514}
    - {name: syslog, protocol: UDP, port: 5514, targetPort: 5514, nodePort: 30514}
---
apiVersion: v1
kind: Service
metadata: {name: wazuh-registration}
spec:
  type: NodePort
  selector: {app: wazuh-manager, node-type: master}
  ports:
    - {name: registration, protocol: TCP, port: 1515, targetPort: 1515, nodePort: 31515}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  annotations: {traefik.ingress.kubernetes.io/service.serversscheme: https}
spec:
  ingressClassName: traefik
  rules:
    - host: wazuh.homelab.pastelariadev.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: dashboard, port: {number: 443}}}}]

apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-indexer, namespace: wazuh}
spec:
  replicas: 1
  template:
    spec:
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - name: indexer-security
          secret: {secretName: indexer-security, defaultMode: 0600}
      initContainers:
        - name: increase-the-vm-max-map-count
          $patch: delete
        - name: volume-mount-hack
          image: harbor.homelab.pastelariadev.com/dockerhub/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      containers:
        - name: wazuh-indexer
          image: harbor.homelab.pastelariadev.com/dockerhub/wazuh/wazuh-indexer:4.14.7@sha256:66b7640cce54f5f20a65e8320601b4570a1306d9f9b334d30bcaa324720a517c
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          readinessProbe: {tcpSocket: {port: indexer-rest}, initialDelaySeconds: 30}
          livenessProbe: {tcpSocket: {port: indexer-rest}, initialDelaySeconds: 60}
          volumeMounts:
            - name: indexer-security
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
  volumeClaimTemplates:
    - metadata: {name: wazuh-indexer}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-slow
        resources: {requests: {storage: 30Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-master, namespace: wazuh}
spec:
  template:
    spec:
      securityContext: {fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: wazuh-manager
          image: harbor.homelab.pastelariadev.com/dockerhub/wazuh/wazuh-manager:4.14.7@sha256:8665c9807a5765253c79e4b072a1b7462c997bd69be949118a8d82ce44dd33e9
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe: {tcpSocket: {port: api}, initialDelaySeconds: 30}
          livenessProbe: {tcpSocket: {port: api}, initialDelaySeconds: 60}
  volumeClaimTemplates:
    - metadata: {name: wazuh-manager-master}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-fast
        resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-worker, namespace: wazuh}
spec:
  replicas: 1
  template:
    spec:
      securityContext: {fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: wazuh-manager
          image: harbor.homelab.pastelariadev.com/dockerhub/wazuh/wazuh-manager:4.14.7@sha256:8665c9807a5765253c79e4b072a1b7462c997bd69be949118a8d82ce44dd33e9
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          ports:
            - {containerPort: 5514, name: syslog, protocol: UDP}
          readinessProbe: {tcpSocket: {port: agents-events}, initialDelaySeconds: 30}
          livenessProbe: {tcpSocket: {port: agents-events}, initialDelaySeconds: 60}
  volumeClaimTemplates:
    - metadata: {name: wazuh-manager-worker}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-fast
        resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wazuh-dashboard, namespace: wazuh}
spec:
  template:
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: wazuh-dashboard
          image: harbor.homelab.pastelariadev.com/dockerhub/wazuh/wazuh-dashboard:4.14.7@sha256:eeff857a664b3c09d3df4407b8749a351f321e4f366ca60ea1dffaa76f2146a7
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {tcpSocket: {port: dashboard}, initialDelaySeconds: 30}
          livenessProbe: {tcpSocket: {port: dashboard}, initialDelaySeconds: 60}
---
apiVersion: v1
kind: Service
metadata: {name: wazuh, namespace: wazuh}
spec: {type: ClusterIP}
---
apiVersion: v1
kind: Service
metadata: {name: wazuh-workers, namespace: wazuh}
spec: {type: ClusterIP}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: wazuh
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: wazuh-dashboard@kubernetescrd
spec: {type: ClusterIP}

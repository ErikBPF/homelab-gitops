apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: indexer-certs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-platform}
  target: {name: indexer-certs}
  dataFrom: [{extract: {key: platform/wazuh/indexer-certs}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: dashboard-certs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-platform}
  target:
    name: dashboard-certs
    template:
      mergePolicy: Merge
      data:
        ca.crt: '{{ index . "root-ca.pem" }}'
  dataFrom: [{extract: {key: platform/wazuh/dashboard-certs}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

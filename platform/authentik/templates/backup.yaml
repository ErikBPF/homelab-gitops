apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-backups
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2, hard]
  claimRef: {namespace: authentik, name: authentik-backups}
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: authentik-backups
    volumeAttributes:
      server: 10.250.0.1
      share: /fast/k8s/authentik-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: authentik-backups}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: authentik-backups
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: authentik-backup-script}
data:
  backup.sh: |-
{{ .Files.Get "files/backup.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: authentik-backup}
spec:
  schedule: "0 0,12 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata: {labels: {app: authentik-backup}}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: harbor.homelab.pastelariadev.com/dockerhub/library/postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
              command: [/bin/bash, /scripts/backup.sh]
              env:
                - {name: PGHOST, value: authentik-postgresql}
                - {name: PGUSER, value: authentik}
                - {name: PGDATABASE, value: authentik}
                - {name: PGCONNECT_TIMEOUT, value: "15"}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: authentik-runtime, key: AUTHENTIK_POSTGRESQL__PASSWORD}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: authentik-backups}
            - name: script
              configMap: {name: authentik-backup-script, defaultMode: 0555}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: authentik-backup-egress}
spec:
  podSelector: {matchLabels: {app: authentik-backup}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: authentik-postgresql}
      ports: [{protocol: TCP, port: 5432}]

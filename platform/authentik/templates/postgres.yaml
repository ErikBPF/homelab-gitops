apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql
  labels: {app.kubernetes.io/name: authentik-postgresql}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: authentik-postgresql}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  labels: {app.kubernetes.io/name: authentik-postgresql}
spec:
  serviceName: authentik-postgresql
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: authentik-postgresql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: authentik-postgresql}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          env:
            - {name: POSTGRES_USER, value: authentik}
            - {name: POSTGRES_DB, value: authentik}
            - {name: POSTGRES_INITDB_ARGS, value: --data-checksums}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: authentik-runtime, key: AUTHENTIK_POSTGRESQL__PASSWORD}
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [pg_isready, -U, authentik, -d, authentik]}
            initialDelaySeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, authentik, -d, authentik]}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 10Gi}}

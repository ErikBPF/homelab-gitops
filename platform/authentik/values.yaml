authentik:
  global:
    image:
      repository: harbor.homelab.pastelariadev.com/ghcr/goauthentik/server
      tag: 2026.8.5
      digest: sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    env:
      - {name: AUTHENTIK_POSTGRESQL__HOST, value: authentik-postgresql}
      - {name: AUTHENTIK_POSTGRESQL__NAME, value: authentik}
      - {name: AUTHENTIK_POSTGRESQL__USER, value: authentik}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile: {type: RuntimeDefault}
  authentik:
    existingSecret: {secretName: authentik-runtime}
    error_reporting: {enabled: false, send_pii: false}
  server:
    replicas: 1
    automountServiceAccountToken: false
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels: {release: monitoring}
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: [authentik.homelab.pastelariadev.com]
  worker:
    replicas: 1
    automountServiceAccountToken: false
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels: {release: monitoring}
  postgresql:
    enabled: false
  geoip: {enabled: false}
  serviceAccount: {create: false}

kube-prometheus-stack:
  alertmanager: {enabled: false}
  kubeStateMetrics: {enabled: false}
  nodeExporter: {enabled: false}
  kubeControllerManager: {enabled: false}
  kubeEtcd: {enabled: false}
  kubeProxy: {enabled: false}
  kubeScheduler: {enabled: false}
  defaultRules:
    create: true
    rules:
      alertmanager: false
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  prometheusOperator:
    admissionWebhooks: {enabled: false}
    tls: {enabled: false}
    image:
      sha: 6dbbbbeca6d7b94aa30723bfaa55262e41b9f8c15304c484611c696503840aac
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    prometheusConfigReloader:
      image:
        sha: 257ce3543e8f45c059dab488bcf897d8cc598cabd78afba12f41d6dbe36e22d2
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
  prometheus:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: [prometheus.homelab.pastelariadev.com]
      paths: [/]
    prometheusSpec:
      image:
        sha: 1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
      enableRemoteWriteReceiver: true
      retention: 30d
      retentionSize: 45GB
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "2", memory: 4Gi}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 50Gi}}
  grafana:
    image:
      sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    testFramework:
      enabled: false
    initChownData:
      image:
        sha: 95cf004f559831017cdf4628aaf1bb30133677be8702a8c5f2994629f637a209
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    admin:
      existingSecret: monitoring-secrets
      userKey: GRAFANA_ADMIN_USER
      passwordKey: GRAFANA_ADMIN_PASSWORD
    envFromSecret: monitoring-secrets
    env:
      GF_SERVER_ROOT_URL: https://grafana.homelab.pastelariadev.com
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    sidecar:
      image:
        sha: a36a5946ea215ca6435a2a7e155a17cc360ac35664ad33fa8f640a1d6786100e
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        searchNamespace: monitoring
      datasources:
        alertmanager: {enabled: false}
    persistence:
      enabled: true
      type: pvc
      storageClassName: nfs-fast
      accessModes: [ReadWriteOnce]
      size: 5Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: [grafana.homelab.pastelariadev.com]
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local

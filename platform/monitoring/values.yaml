kube-prometheus-stack:
  alertmanager: {enabled: false}
  kubeStateMetrics: {enabled: false}
  nodeExporter: {enabled: false}
  kubeControllerManager: {enabled: false}
  kubeEtcd: {enabled: false}
  kubeProxy: {enabled: false}
  kubeScheduler: {enabled: false}
  defaultRules:
    create: true
    disabled:
      PrometheusNotConnectedToAlertmanagers: true
    rules:
      alertmanager: false
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  kubelet:
    serviceMonitor:
      # `up` is synthetic, so its cluster label must come from target relabeling.
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - action: replace
          targetLabel: cluster
          replacement: homelab
  prometheusOperator:
    admissionWebhooks: {enabled: false}
    tls: {enabled: false}
    image:
      registry: harbor.homelab.pastelariadev.com/quay
      sha: c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    prometheusConfigReloader:
      image:
        registry: harbor.homelab.pastelariadev.com/quay
        sha: a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
  prometheus:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: [prometheus.homelab.pastelariadev.com]
      paths: [/]
      tls:
        - secretName: monitoring-ingress-tls
          hosts: [prometheus.homelab.pastelariadev.com]
    prometheusSpec:
      image:
        registry: harbor.homelab.pastelariadev.com/quay
        sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
      enableRemoteWriteReceiver: true
      retention: 15d
      retentionSize: 25GB
      resources:
        requests: {cpu: 100m, memory: 1Gi}
        limits: {cpu: "2", memory: 4Gi}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 50Gi}}
  grafana:
    image:
      registry: harbor.homelab.pastelariadev.com/dockerhub
      sha: 540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df
    # The chart maps this list to GF_PLUGINS_PREINSTALL_SYNC, so Grafana itself
    # downloads the plugin at startup. That runs inside the distroless image;
    # no shell-based installer or non-distroless variant is needed.
    plugins:
      - grafana-opensearch-datasource
    testFramework:
      enabled: false
    initChownData:
      image:
        registry: harbor.homelab.pastelariadev.com/dockerhub
        sha: 95cf004f559831017cdf4628aaf1bb30133677be8702a8c5f2994629f637a209
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    admin:
      existingSecret: monitoring-secrets
      userKey: GRAFANA_ADMIN_USER
      passwordKey: GRAFANA_ADMIN_PASSWORD
    envFromSecret: monitoring-secrets
    env:
      GF_SERVER_ROOT_URL: https://grafana.homelab.pastelariadev.com
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    sidecar:
      image:
        registry: harbor.homelab.pastelariadev.com/quay
        sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        searchNamespace: monitoring
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: monitoring
      datasources:
        alertmanager: {enabled: false}
    persistence:
      enabled: true
      type: pvc
      storageClassName: nfs-fast
      accessModes: [ReadWriteOnce]
      size: 5Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: [grafana.homelab.pastelariadev.com]
      tls:
        - secretName: monitoring-ingress-tls
          hosts: [grafana.homelab.pastelariadev.com]
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
      - name: Wazuh
        type: grafana-opensearch-datasource
        uid: wazuh
        access: proxy
        url: https://wazuh-indexer-0.wazuh-indexer.wazuh.svc.cluster.local:9200
        basicAuth: true
        basicAuthUser: $WAZUH_INDEXER_USERNAME
        secureJsonData:
          basicAuthPassword: $WAZUH_INDEXER_PASSWORD
          tlsCACert: $WAZUH_INDEXER_CA
        jsonData:
          timeField: "@timestamp"
          tlsAuthWithCACert: true

# S04 Endeavour pilot; merge only after collector backend verification.
hostIntegrity:
  expectedChecks:
    - instance: endeavour
      check: signatures
    - instance: endeavour
      check: store
    - instance: endeavour
      check: av

apiVersion: 1

# Tombstone: removing a rule from `groups` does NOT delete it from Grafana's DB
# (file-provisioned alerting is not pruned on reload). Retired rules stay listed
# here so a restored Grafana database converges to the same source state.
# `litellm-semantic-readiness-failed` is retired while the Apollo/Qwen stack is
# rebuilt; its qwen-chat route dependency made any backend blip page as critical.
deleteRules:
  - orgId: 1
    uid: litellm-semantic-readiness-failed

groups:
  - orgId: 1
    name: recovery-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: sops-runtime-secrets-missing
        title: Sops runtime secrets missing
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Discovery or Kepler has not materialized /run/secrets after boot"
        labels: {severity: critical}
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                (count(sops_runtime_secrets_ready{instance=~"discovery|kepler"}) != bool 2)
                + (min(sops_runtime_secrets_ready{instance=~"discovery|kepler"}) < bool 1)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      # The producer last_success metric is file mtime. Unchanged secret
      # content keeps its mtime; it is not renderer liveness.
      - uid: vault-agent-renders-stale
        title: Vault Agent required renders missing
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Discovery Vault Agent required renders are missing — inspect vault-agent.service and the required render health probe"
        labels: {severity: critical}
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                (count(vault_agent_required_renders_ready{instance="discovery"}) != bool 1)
                + (max(vault_agent_required_renders_ready{instance="discovery"}) < bool 1)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: openbao-authenticated-probe-failed
        title: OpenBao authenticated probe failed or stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Discovery OpenBao authenticated request failed, or probe evidence is missing/older than 10m — inspect openbao-seal-probe, vault-agent and audit ownership through desktop-nixos diagnostics"
        labels: {severity: critical, instance: discovery}
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                ((min(openbao_authenticated_probe_success{instance="discovery"}) != bool 1) or vector(1))
                + (((time() - max(openbao_authenticated_probe_timestamp_seconds{instance="discovery"})) > bool 600) or vector(1))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: restic-kepler-offsite-transport-failed
        title: Kepler offsite Restic transport failed
        condition: C
        for: 20m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Kepler cannot query Voyager Restic repository from the backup container"
        labels: {severity: warning}
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                (count(restic_kepler_offsite_transport_ready) != bool 1)
                + (max(restic_kepler_offsite_transport_ready) < bool 1)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: grafana-notification-delivery-failed
        title: Grafana notification delivery failed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "Grafana failed to deliver at least one alert notification in 15m"
        labels: {severity: warning}
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: sum(increase(grafana_alerting_notification_requests_failed_total[15m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: authentik-offsite-aging
        title: Authentik offsite recovery source exceeds 18 hours
        condition: C
        for: 0m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: Authentik offsite source is missing, future-dated or at least 18 hours old; inspect authentik-backup and the selective Restic job. Upload time is not recovery freshness.
        labels:
          severity: warning
          instance: kepler
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            instant: true
            datasource:
              type: prometheus
              uid: prometheus
            expr: (time() - min(restic_authentik_offsite_source_timestamp_seconds{instance="kepler"}) >= bool 64800) + (max(restic_authentik_offsite_source_timestamp_seconds{instance="kepler"}) > bool time())
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 0

      - uid: authentik-offsite-rpo-breached
        title: Authentik offsite recovery source exceeds 24 hours
        condition: C
        for: 0m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: Authentik offsite source is missing, future-dated or at least 24 hours old; inspect authentik-backup and the selective Restic job. Upload time is not recovery freshness.
        labels:
          severity: critical
          instance: kepler
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            instant: true
            datasource:
              type: prometheus
              uid: prometheus
            expr: (time() - min(restic_authentik_offsite_source_timestamp_seconds{instance="kepler"}) >= bool 86400) + (max(restic_authentik_offsite_source_timestamp_seconds{instance="kepler"}) > bool time())
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 0

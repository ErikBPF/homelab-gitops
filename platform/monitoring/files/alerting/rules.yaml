              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: k8s-deployment-unavailable
        title: Kubernetes deployment replicas unavailable
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas for 15m"
        labels:

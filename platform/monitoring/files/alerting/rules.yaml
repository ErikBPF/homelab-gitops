apiVersion: 1

# Tombstone: removing a rule from `groups` does NOT delete it from Grafana's DB
# (file-provisioned alerting is not pruned on reload). Retired rules stay listed
# here so a restored Grafana database converges to the same source state.
deleteRules:
  - orgId: 1
    uid: disk-fill-24h
  - orgId: 1
    uid: netbird-relay-scrape-down
  - orgId: 1
    uid: security-control-unifi-siem-silent
  - orgId: 1
    uid: apollo-k3s-readiness

groups:
  # Compose container health. Discovery exports Docker metrics through cAdvisor;
  # Kepler/Orion export rootless Podman metrics through podman-exporter.
  - orgId: 1
    name: containers
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: container-telemetry-identity-missing
        title: Discovery container telemetry identity missing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}: named Docker container telemetry is absent or stale — check Alloy/cAdvisor startup"
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#container-and-systemd-alerts
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                absent(container_last_seen{host="discovery",name!=""})
                or (time() - max by (host) (container_last_seen{host="discovery",name!=""}) > 120)
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: container-critical-down
        title: Critical container down (>2 min)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.name }}: critical container stopped, missing, or stale"
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#container-and-systemd-alerts
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                (
                  (time() - container_last_seen{host="discovery",name=~"swag|adguard|postgres|vault"} > 120)
                  or absent(container_last_seen{host="discovery",name="swag"})
                  or absent(container_last_seen{host="discovery",name="adguard"})
                  or absent(container_last_seen{host="discovery",name="postgres"})
                  or absent(container_last_seen{host="discovery",name="vault"})
                )
                and on(host)
                (time() - max by (host) (container_last_seen{host="discovery",name!=""}) <= 120)
                or (
                  (
                    (podman_container_state{host="kepler",name=~"postgres|redis"} != bool 2)
                    or absent(podman_container_state{host="kepler",name="postgres"})
                    or absent(podman_container_state{host="kepler",name="redis"})
                  )
                  and on() (max(up{instance="kepler",job="integrations/unix"}) == 1)
                )
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: container-restart-storm
        title: Container restarting rapidly (crash-loop suspected)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.name }}: >3 restarts in 15 min — crash-loop suspected"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                changes(container_start_time_seconds{name!="",name!~".*-init|.*pause.*|POD"}[15m]) > 3
                or changes(podman_container_started_seconds{name!="",name!~".*-init|.*pause.*|POD|podman-exporter"}[15m]) > 3
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: container-unhealthy
        title: Container unhealthy (>5 min)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.name }}: container reports unhealthy for >5 min — check its healthcheck and logs"
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#container-and-systemd-alerts
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (host, name, project) (container_health_unhealthy{host="discovery"}) == 1
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # Backup dead-man's-switch. restic-tofu-state (discovery) writes
  # restic_tofu_state_last_success_seconds to the node_exporter textfile dir on
  # each successful daily backup (06:30). This fires if no success in 30h (a
  # missed daily run + margin) OR if the metric is absent/stale (dead timer,
  # host down) — noData ⇒ Alerting, which is the whole point of a dead-man's
  # switch. Replaces self-hosted Healthchecks for this job. NOTE: alerts until
  # the first successful backup writes the metric after rollout.
  - orgId: 1
    name: backups
    folder: Infra Alerts
    interval: 5m
    rules:
      - uid: restic-tofu-state-stale
        title: restic tofu-state backup stale (>30h) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "tofu-state restic backup has not succeeded in >30h (or its liveness metric is absent) — check restic-backups-tofu-state.timer/.service on discovery"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - restic_tofu_state_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      # OpenBao platform-secrets-store backup dead-man's-switch. The
      # restic-backups-vault job (discovery) writes vault_backup_last_success_seconds
      # on each successful daily raft-snapshot backup (03:00). Fires if no success
      # in 30h or the metric is absent/stale (noData⇒Alerting). See
      # docs/proposals/2026-06-29-vault-backup-plan.md.
      - uid: vault-backup-stale
        title: OpenBao snapshot backup stale (>30h) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "OpenBao raft-snapshot backup has not succeeded in >30h (or its liveness metric is absent) — check restic-backups-vault.timer/.service on discovery"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - vault_backup_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      # Quarterly isolated snapshot restore. Allow 100 days for the scheduled
      # Jan/Apr/Jul/Oct run plus timer randomization and brief host downtime.
      - uid: openbao-restore-drill-stale
        title: OpenBao restore drill stale (>100d) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "OpenBao restore drill has not passed in >100d or its metric is missing — inspect its timer and last result, then follow the desktop-nixos isolated restore procedure"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - openbao_restore_drill_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [8640000]

      # OpenBao OFF-SITE backup dead-man's-switch. The off-site restic copy of the
      # raft snapshot writes vault_offsite_backup_last_success_seconds on each
      # successful run. Fires if no success in 30h or the metric is absent/stale
      # (noData⇒Alerting). Mirrors vault-backup-stale; the off-site leg can fail
      # independently of the local one (network/remote-host).
      - uid: vault-offsite-backup-stale
        title: OpenBao off-site backup stale (>30h) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "OpenBao off-site backup has not succeeded in >30h (or its liveness metric is absent) — check the off-site restic-backups-vault leg"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - vault_offsite_backup_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      - uid: restic-tofu-state-b2-stale
        title: B2 tofu-state backup stale (>30h) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Backblaze B2 tofu-state backup has not succeeded in >30h (or its metric is absent) — check restic-backups-tofu-state-b2 on discovery"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - restic_tofu_state_b2_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      - uid: vault-b2-backup-stale
        title: B2 OpenBao backup stale (>30h) or missing
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Backblaze B2 OpenBao backup has not succeeded in >30h (or its metric is absent) — check restic-backups-vault-b2 on discovery"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - vault_b2_backup_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

  # Host health (fleet observability RFC 2026-06-29). All metrics already arrive
  # via each host's Alloy remote_write; these are the alert rules that were
  # missing. NOTE: the up{job=...} label below was verified 2026-06-30 against
  # the live discovery Prometheus (/api/v1/label/job/values) — confirmed value is
  # "integrations/unix" (alloy's prometheus.exporter.unix default). No edit needed.
  - orgId: 1
    name: host-health
    folder: Infra Alerts
    interval: 5m
    rules:
      - uid: host-alloy-down
        title: Host metrics push missing (host may be down)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: no host metrics received for >10 min — Alloy stopped or host unreachable"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="integrations/unix"}
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # host-alloy-down only matches up==0 — a host that vanishes from the
      # vector entirely (alloy dead AND nothing re-pushing the up series, e.g.
      # pathfinder silent ≥7d on 2026-07-02) produces no series and no NoData
      # while other hosts keep the query non-empty. This rule closes that hole
      # with absent_over_time per ALWAYS-ON host. Workstations (pathfinder,
      # laptop) are excluded — they power off legitimately. voyager has its own
      # scrape-down rule. Monitoring now runs on Kepler, so Discovery's
      # disappearance is independently observable too.
      # 20m window tolerates the observed 5-15m remote_write lag. Watches `up`
      # (not node_uname_info) so it doesn't double-fire with host-alloy-down
      # when an exporter scrape fails while Alloy still pushes: up present ⇒
      # host-alloy-down owns it; up gone ⇒ this rule owns it.
      # for: 2m, not 10m — the [20m] absent_over_time window IS the
      # remote_write-lag debounce; stacking another 10m only delayed the page.
      - uid: host-metrics-absent
        title: Always-on host vanished from metrics
        condition: C
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: host has stopped pushing metrics entirely — host down, network partition, or Alloy dead without recovery"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 1500
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                absent_over_time(up{instance="kepler",job="integrations/unix"}[20m])
                or absent_over_time(up{instance="orion",job="integrations/unix"}[20m])
                or absent_over_time(up{instance="apollo",job="integrations/unix"}[20m])
                or absent_over_time(up{instance="discovery",job="integrations/unix"}[20m])
          - refId: B
            relativeTimeRange:
              from: 1500
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1500
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-memory-critical
        title: Host memory available < 5% for 15m
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: available memory < 5% of total — RAM pressure / OOM risk"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < bool 0.05
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                # gt 0: the filtered expr only returns (positive-ratio) series
                # when a host is under 5% — "any value present" means breach.
                # (was `lt 0`, which a positive ratio can never satisfy.)
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-oom-kill
        title: OOM kill event on host
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: kernel OOM killer fired in the last 10 min — a process was killed for memory exhaustion"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              # Workstations excluded 2026-07-02: laptop OOM-killed 11x/week
              # (browser/dev workloads — expected, user notices locally); only
              # server OOMs are actionable. Dashboards still chart all hosts.
              expr: increase(node_vmstat_oom_kill{instance!~"laptop|pathfinder"}[10m]) > 0
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Fleet-wide variant of disk-fill-24h (which is discovery-/-only). Covers
      # kepler's ZFS pools (/bulk, /fast) and any host's root. Keeps the subvol
      # dedup: btrfs subvols share disk + report identical free, so an anchored
      # mountpoint regex avoids 5× fan-out per physical disk. NOTE: overlaps the
      # original disk-fill-24h on discovery's "/" + vault mounts — retire that
      # rule on the same rollout to avoid duplicate alerts (deploy gate).
      - uid: host-disk-fill-fleet
        title: Filesystem predicted to fill within 24h (fleet-wide)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: <20% free and trending to fill within 24h"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                (predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|vfat",mountpoint=~"/|/home/erik/vault|/bulk|/fast"}[6h], 86400) < 0)
                and
                (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|vfat",mountpoint=~"/|/home/erik/vault|/bulk|/fast"} / node_filesystem_size_bytes < 0.20)
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [0]

      # Load-per-core instead of raw CPU%: orion/kepler legitimately peg CPU for
      # long stretches (nix builds, AI inference), so sustained-high-CPU is
      # noise there. load15 > 2× cores for 30m means real queueing beyond
      # capacity, whatever the workload.
      - uid: host-load-high
        title: Host load > 2x cores for 30m
        condition: C
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: 15-min load average exceeds 2x core count — sustained CPU queueing"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                node_load15
                / on (instance) count by (instance) (node_cpu_seconds_total{mode="idle"})
                > 2
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                # gt 0: filtered expr only returns series above the 2x ratio.
                - evaluator:
                    type: gt
                    params: [0]

      # Sustained swap in+out (pages/s) — occasional swapping is fine, a steady
      # ~2 MB/s (500 pages/s) for 15m means the host is thrashing.
      - uid: host-swap-thrash
        title: Host swapping heavily for 15m
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: sustained swap in+out >500 pages/s for 15m — memory thrash, expect severe slowdown"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              # Workstations excluded 2026-07-02 (same rationale as oom-kill):
              # laptop swaps under normal heavy desktop use; only server
              # swap-thrash is actionable.
              expr: >-
                rate(node_vmstat_pswpin{instance!~"laptop|pathfinder"}[10m]) + rate(node_vmstat_pswpout{instance!~"laptop|pathfinder"}[10m]) > 500
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Inode exhaustion. btrfs reports node_filesystem_files == 0 (dynamic
      # inodes) → 0/0 = NaN drops out of the comparison, so this effectively
      # covers the ext4/vfat mounts (voyager /, ESPs, the Loki vault volume)
      # where inodes actually run out.
      - uid: host-inode-low
        title: Filesystem inodes < 5% free
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: fewer than 5% inodes free — file creation will start failing"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}
                / node_filesystem_files < bool 0.05
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: adguard-scrape-down
        title: AdGuard metrics scrape failing
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "AdGuard exporter has been unreachable for 5m — whole-LAN DNS may be unavailable"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: 1 - max(up{job="adguard"})
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: cloudflared-scrape-down
        title: Cloudflare tunnel metrics scrape failing
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "cloudflared has been unreachable for 10m — public ingress may be unavailable"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: 1 - max(up{job="cloudflared"})
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: litellm-scrape-down
        title: LiteLLM metrics scrape failing
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "LiteLLM has been unreachable for 10m — AI routing may be unavailable"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: 1 - max(up{job="litellm"})
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: pangolin-newt-down
        title: Pangolin site redundancy degraded
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Fewer than two Pangolin home sites are healthy — remote ingress redundancy is reduced"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: 2 - count(up{job="pangolin-newt"} == 1)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

  # Voyager offsite DR anchor (offsite-dr-crown-jewels §11 follow-up). Voyager
  # is scraped (job=node-voyager), not Alloy-pushed, so host-alloy-down does not
  # cover it — voyager-scrape-down is its dead-man. The append-only restic repos
  # never prune, so / only ever grows; the fill-24h trend rule can stay silent on
  # slow growth, hence the static <15%-free threshold. Prune procedure:
  # desktop-nixos docs/reference/voyager-offsite-maintenance.md.
  - orgId: 1
    name: voyager-offsite
    folder: Infra Alerts
    interval: 5m
    rules:
      - uid: voyager-scrape-down
        title: Voyager metrics scrape failing (offsite DR anchor may be down)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "voyager node_exporter scrape failing or absent for >10 min — offsite DR anchor unreachable (host down, tailnet, or exporter dead)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="node-voyager"}
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: voyager-disk-low
        title: Voyager root filesystem <15% free (append-only repos never prune)
        condition: C
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "voyager / is below 15% free — inspect filesystem and Restic repository usage, then follow desktop-nixos docs/reference/voyager-offsite-maintenance.md"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                node_filesystem_avail_bytes{job="node-voyager",mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|vfat"}
                / node_filesystem_size_bytes < bool 0.15
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                # gt 0: filtered expr returns the (positive) ratio only when
                # under 15% free — presence means breach ("lt 0" never fires).
                - evaluator:
                    type: gt
                    params: [0]

      # Weekly restic check of the voyager repos runs on discovery
      # (restic-check-voyager.timer, Sun 05:00) and writes
      # restic_voyager_check_last_success_seconds on success. 9 days = one
      # missed weekly run + margin. noData⇒Alerting (dead-man's switch); NOTE:
      # alerts until the first successful check writes the metric after rollout.
      # for: 1h (was 15m) since 2026-07-02: a single missed scrape of the
      # textfile metric flipped it Pending(NoData) — an hour of confirmation
      # costs nothing against a 9-day threshold and kills the flapping.
      - uid: restic-voyager-check-stale
        title: Voyager restic check stale (>9d) or missing
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "restic check of the voyager offsite repos has not succeeded in >9 days (or its liveness metric is absent) — check restic-check-voyager.timer/.service on discovery"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - restic_voyager_check_last_success_seconds
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [777600]

      # Kepler's three daily Ofelia jobs publish one textfile gauge each only
      # after restic succeeds. 30h allows a six-hour scheduling/maintenance
      # margin while preserving missing-metric dead-man semantics.
      - uid: restic-kepler-backups-stale
        title: Kepler compose backup stale (>30h) or missing
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Kepler {{ $labels.backup }} backup has not succeeded in >30h or its metric is missing — inspect the sync stack and Ofelia jobs"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                label_replace((time() - restic_kepler_postgres_last_success_seconds{instance="kepler"} > bool 108000) or absent(restic_kepler_postgres_last_success_seconds{instance="kepler"}), "backup", "postgres", "", "")
                or label_replace((time() - restic_kepler_configs_last_success_seconds{instance="kepler"} > bool 108000) or absent(restic_kepler_configs_last_success_seconds{instance="kepler"}), "backup", "configs", "", "")
                or label_replace((time() - restic_kepler_offsite_last_success_seconds{instance="kepler"} > bool 108000) or absent(restic_kepler_offsite_last_success_seconds{instance="kepler"}), "backup", "offsite", "", "")
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]

  # Platform secrets store (OpenBao @discovery). The 2026-06-30 boot left the
  # store sealed for ~21h unnoticed — vault-agent renders and lab ESO silently
  # stale. openbao-seal-probe (desktop-nixos vault.nix) writes openbao_sealed
  # every 5 min via the textfile collector; 1 = sealed OR unreachable. noData ⇒
  # Alerting: an absent metric means the probe/pipeline died, which is the same
  # blindness this rule exists to end.
  - orgId: 1
    name: platform-vault
    folder: Infra Alerts
    interval: 5m
    rules:
      - uid: openbao-sealed
        title: OpenBao sealed or unreachable (runtime secrets frozen)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "OpenBao on discovery is sealed or unreachable — inspect health and openbao-unseal.service, then follow the desktop-nixos recovery runbook"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: openbao_sealed
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # Failed systemd units (desktop-nixos fleet-upgrade-hardening RFC P2,
  # 2026-07-12). Critical units previously sat failed for hours with zero
  # alerts; the failures were found only by looking. The
  # node_exporter/Alloy `systemd` collector (enabled fleet-wide in desktop-nixos
  # node-exporter.nix + alloy.nix) now emits node_systemd_unit_state; this pages
  # when any unit sits `failed` for >10m. systemd-networkd-wait-online is excluded
  # — its non-zero result is the documented false-fatal on this fleet
  # (memory/fleet_upgrade_2026_07_12), not a real failure. Routed to the incidents
  # Discord channel via the root policy (severity=warning: first notification is
  # prompt after the 10m `for`, repeat 4h — catches an 8h outage without paging on
  # every transient/benign unit failure). interval 1m for fast detection.
  - orgId: 1
    name: host-systemd
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: host-systemd-unit-failed
        title: systemd unit failed on host
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: systemd unit {{ $labels.name }} is failed — check `systemctl status {{ $labels.name }}` / `journalctl -u {{ $labels.name }}` on the host"
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#container-and-systemd-alerts
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: node_systemd_unit_state{state="failed",name!="systemd-networkd-wait-online.service"} == 1
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # Runtime security controls. Observe-only first: these stay paused until the
  # hostname-labeled Alloy self-metrics producer is deployed and seven days of
  # baseline data have been reviewed.
  - orgId: 1
    name: security-control-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: security-control-systemd-inactive
        title: Host security control inactive
        condition: C
        for: 10m
        isPaused: false
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.name }} is inactive for >10 min"
          event_class: security_control_inactive
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#security-control-telemetry
        labels:
          severity: warning
          category: security
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: max by (instance, name) (node_systemd_unit_state{name=~"(auditd|fail2ban)\\.service",state="active"}) == bool 0
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: security-control-loki-write-failures
        title: Host journal delivery failures
        condition: C
        for: 10m
        isPaused: false
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.instance }}: Alloy failed or dropped journal entries ({{ $labels.reason }})"
          event_class: security_log_delivery_failure
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#security-control-telemetry
        labels:
          severity: warning
          category: security
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (instance, component_id, reason) (increase(loki_write_failures_logged_total[10m]) or increase(loki_write_dropped_entries_total[10m]))
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # Kubernetes workload health. Metrics arrive from the cluster Alloy through
  # remote_write, which has shown 5-15 minute lag during reconciliation. Keep
  # these rules at 15m so controller churn does not page. Dedicated datasource
  # health canaries below report query failures without false workload alerts.
  - orgId: 1
    name: kubernetes-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: k8s-node-not-ready
        title: Kubernetes node not ready
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "cluster {{ $labels.cluster }}: node {{ $labels.node }} has remained NotReady for 15m"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: max by (cluster, node) (kube_node_status_condition{condition="Ready",status="true"} == bool 0)
          - refId: B
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: k8s-container-crashloop
        title: Kubernetes container CrashLoopBackOff
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has remained in CrashLoopBackOff for 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: max by (cluster, namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[15m]))
          - refId: B
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: k8s-pvc-pending
        title: Kubernetes PVC pending
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has remained Pending for 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: max by (cluster, namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1)
          - refId: B
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: k8s-job-failed
        title: Kubernetes job failed
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.job_name }} has a terminal Failed condition for 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A

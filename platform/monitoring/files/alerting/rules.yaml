                type: prometheus
                uid: prometheus
              expr: max by (cluster, namespace, job_name) (kube_job_failed{condition="true"} == 1)
          - refId: B
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__

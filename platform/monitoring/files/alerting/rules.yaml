              datasource: {type: prometheus, uid: prometheus}
              expr: max by (cluster, name, namespace, health_status, sync_status) (argocd_app_info{health_status!="Healthy"} or argocd_app_info{sync_status!="Synced"})
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

  - orgId: 1
    name: kubernetes-telemetry-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: k8s-alloy-oom
        title: Kubernetes Alloy OOMKilled
        condition: C
        for: 0s
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }}: Alloy restarted in the last 15m with latest termination reason OOMKilled"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                max by (cluster, namespace, pod, container) (
                  (kube_pod_container_status_last_terminated_reason{namespace="monitoring",container="alloy",reason="OOMKilled"} == 1)
                  and on (cluster, namespace, pod, container, uid)
                  (increase(kube_pod_container_status_restarts_total{namespace="monitoring",container="alloy"}[15m]) > 0)
                )
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-alloy-restarted
        title: Kubernetes Alloy restarted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "Alloy restarted in the last 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: sum by (cluster, namespace, container) (increase(kube_pod_container_status_restarts_total{namespace="monitoring",container="alloy"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-alloy-not-ready
        title: Kubernetes Alloy not ready
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }}: Alloy has not been ready for 5m"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: 1 - max by (cluster, namespace, pod, container) (kube_pod_container_status_ready{namespace="monitoring",container="alloy"})
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-alloy-remote-write-backlog
        title: Kubernetes Alloy remote-write backlog
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Alloy remote-write backlog has grown by >10 samples/s for 10m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: max by (cluster, instance) (deriv(prometheus_remote_storage_samples_pending{job="alloy-metrics"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [10]}}]

      - uid: k8s-alloy-remote-write-retries
        title: Kubernetes Alloy remote-write retries
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "Alloy remote-write retries continued for 10m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: sum by (cluster, instance) (increase(prometheus_remote_storage_samples_retried_total{job="alloy-metrics"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-etcd-targets-missing
        title: Kubernetes etcd metrics targets missing
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "Fewer than three etcd metrics targets have been up for 5m"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: clamp_min(3 - count(up{job="etcd"} == 1), 0)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

  # SSH detections remain observe-only through the baseline review gate.
  - orgId: 1
    name: ssh-security-monitoring
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: security-ssh-failure-burst
        title: SSH authentication failure burst
        condition: C
        for: 5m
        isPaused: false
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}: SSH authentication failure burst detected"
          event_class: ssh_authentication_failure_burst
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#ssh-security-monitoring
        labels: {severity: warning, category: security}
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              datasource: {type: loki, uid: loki}
              expr: 'sum by (host, source_ip) (count_over_time({source="journal"} |~ "Failed password|Invalid user|PAM: Authentication failure|maximum authentication attempts exceeded" !~ "query=|security-ssh-failure-burst|count_over_time" | regexp " from (?P<source_ip>[0-9a-fA-F:.]+)" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [4]}}]

      - uid: security-ssh-public-login
        title: SSH login from non-whitelisted host
        condition: C
        for: 0s
        isPaused: false
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.host }}: SSH login from a non-whitelisted source detected"
          event_class: ssh_non_whitelisted_login
          runbook_url: https://github.com/ErikBPF/servarr/blob/main/machines/discovery/RUNBOOK.md#ssh-security-monitoring
        labels: {severity: warning, category: security}
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              datasource: {type: loki, uid: loki}
              expr: 'sum by (host, source_ip, ssh_user, auth_method, fingerprint) (count_over_time({source="journal"} |~ "Accepted (publickey|password)" !~ "query=|security-ssh-public-login|count_over_time" | regexp "Accepted (?P<auth_method>publickey|password) for (?P<ssh_user>[^ ]+) from (?P<source_ip>[^ ]+) port [^ ]+ ssh2(?:: [^ ]+ (?P<fingerprint>SHA256:[^ ]+))?" | source_ip !~ "^(192\\.168\\.10\\.147|192\\.168\\.10\\.200|192\\.168\\.10\\.205|100\\.107\\.225\\.13|fd7a:115c:a1e0::d53b:e10e|192\\.168\\.10\\.210|100\\.76\\.140\\.121|100\\.66\\.253\\.15|fd7a:115c:a1e0::113b:fd0f|127\\.0\\.0\\.1|::1)$" | fingerprint !~ "^(SHA256:dlP1RdOO0EGo0EG2wj4E4xdE0E4W9oZdnKj3Zlb8anI|SHA256:JHKSkDkCbnAot\\+p6FEx8g2frKyl0VQxaXgOaOFhOcyE|SHA256:SPUVdLfcMHe7ANHnPT1uF\\+/8HzzpSn6M81ydw\\+RvQD4)$" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

  # Ordinary rules keep their last state during backend interruptions. These two
  # canaries preserve one actionable DatasourceError per backend without turning
  # a single restart into one error instance per rule.
  - orgId: 1
    name: alert-datasource-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: datasource-prometheus-health
        title: Prometheus alert datasource unavailable
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Grafana cannot evaluate Prometheus-backed alerts for 2m"
        labels: {severity: critical}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: vector(0)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: datasource-loki-health
        title: Loki alert datasource unavailable
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Grafana cannot evaluate Loki-backed security alerts for 2m"
        labels: {severity: warning}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              datasource: {type: loki, uid: loki}
              expr: 'sum(count_over_time({source=~".+"}[1m]))'
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: lt, params: [0]}}]


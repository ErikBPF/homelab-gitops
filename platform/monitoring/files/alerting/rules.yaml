              expr: max by (cluster, namespace, statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready) > 0
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-hpa-at-max
        title: Kubernetes HPA at maximum replicas
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has remained at maximum replicas for 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource: {type: prometheus, uid: prometheus}
              expr: max by (cluster, namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_current_replicas) >= on (cluster, namespace, horizontalpodautoscaler) max by (cluster, namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas)
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: k8s-argocd-unhealthy
        title: Argo CD application unhealthy or out of sync
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          summary: "Argo CD {{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.name }}: health={{ $labels.health_status }}, sync={{ $labels.sync_status }} for 15m"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus

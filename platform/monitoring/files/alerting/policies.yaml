# Root notification policy → discord. Provisioning the policy tree makes it the
# default route (replaces Grafana's no-op email default) and read-only in the UI.
# Child routes implement the two-channel severity split (fleet observability RFC
# fork C): severity=critical pages the incidents channel more often (repeat 1h);
# severity=info goes to the quieter deploys channel. Anything unmatched (e.g.
# severity=warning) falls through to the root discord(=incidents) route at 4h.
apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: ['grafana_folder', 'alertname', 'datasource_uid']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: discord-deploys
        object_matchers:
          - ['severity', '=', 'info']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h

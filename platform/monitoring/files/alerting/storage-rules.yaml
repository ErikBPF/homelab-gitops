apiVersion: 1

groups:
  - orgId: 1
    name: discovery-storage
    folder: Infra Alerts
    interval: 5m
    rules:
      - uid: discovery-storage-low
        title: Discovery filesystem below 15% free
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: KeepLast
        annotations:
          summary: "discovery {{ $labels.mountpoint }}: less than 15% free"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              datasource:
                type: prometheus
                uid: prometheus
              expr: min by (instance, mountpoint) (node_filesystem_avail_bytes{instance="discovery",mountpoint=~"/|/home/erik/vault"} / node_filesystem_size_bytes{instance="discovery",mountpoint=~"/|/home/erik/vault"})
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]

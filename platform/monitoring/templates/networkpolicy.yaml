apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-monitoring-runtime}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
  egress:
    - to: [{podSelector: {}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
---
# The Wazuh manager ships its alert stream to the Loki gateway
# (platform/wazuh/config/alloy-alerts.alloy). The policies above admit only
# same-namespace and traefik ingress, so this opens exactly the Loki gateway
# pods on their container port and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-wazuh-alerts-to-loki-gateway}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: wazuh}}
          podSelector: {matchLabels: {app: wazuh-manager}}
      ports: [{protocol: TCP, port: 8080}]

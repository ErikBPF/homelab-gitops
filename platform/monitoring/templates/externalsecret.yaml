apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: monitoring}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-platform}
  target: {name: monitoring-secrets}
  data:
    - {secretKey: GRAFANA_ADMIN_USER, remoteRef: {key: platform/monitoring, property: GRAFANA_ADMIN_USER}}
    - {secretKey: GRAFANA_ADMIN_PASSWORD, remoteRef: {key: platform/monitoring, property: GRAFANA_ADMIN_PASSWORD}}
    - {secretKey: GF_SECURITY_SECRET_KEY, remoteRef: {key: platform/monitoring, property: GRAFANA_SECRET_KEY}}
    - {secretKey: DISCORD_WEBHOOK_INCIDENTS, remoteRef: {key: platform/monitoring, property: DISCORD_WEBHOOK_INCIDENTS}}
    - {secretKey: DISCORD_WEBHOOK_DEPLOYS, remoteRef: {key: platform/monitoring, property: DISCORD_WEBHOOK_DEPLOYS}}
    - {secretKey: WEBHOOK_GRAFANA_ALERTS_SECRET, remoteRef: {key: platform/monitoring, property: WEBHOOK_GRAFANA_ALERTS_SECRET}}

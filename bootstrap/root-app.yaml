# App-of-apps: kubectl apply'd once by `just bootstrap`. Main is protected by a
# required kubeconform check, so root and child Applications sync `main`
# automatically; `just sync <sha> <app>` stays the exact-revision escape hatch
# for rollback and one-time operations.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    # Private remote; Argo authenticates with the reconciled read-only deploy key.
    repoURL: ssh://git@ssh.github.com:443/ErikBPF/homelab-gitops.git
    targetRevision: main
    path: clusters/kepler/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

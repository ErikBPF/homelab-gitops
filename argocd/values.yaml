# Values nest under the dependency name. Lab sizing: tiny requests, single
# replicas, no SSO. TLS terminated at the kepler L4 LB → run server insecure.
argo-cd:
  global:
    domain: argocd.k8s.pastelariadev.com

  configs:
    params:
      server.insecure: true # TLS at the L4 LB / ingress; don't double-terminate

  dex:
    enabled: false # single operator, local admin

  server:
    ingress:
      enabled: true
      ingressClassName: traefik # existing Nix-deployed ingress-nginx
      hostname: argocd.k8s.pastelariadev.com
    resources:
      requests: { cpu: 10m, memory: 64Mi }

  controller:
    resources:
      requests: { cpu: 25m, memory: 128Mi }
    metrics:
      enabled: true # exposes argocd-application-controller-metrics (:8082) for alloy-metrics

  repoServer:
    resources:
      requests: { cpu: 10m, memory: 64Mi }

  redis:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

  applicationSet:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

  notifications:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

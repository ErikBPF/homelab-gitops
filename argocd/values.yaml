# Values nest under the dependency name. Lab sizing: tiny requests, single
# replicas, no SSO. TLS terminated at the kepler L4 LB → run server insecure.
argo-cd:
  global:
    domain: argocd.k8s.pastelariadev.com
    priorityClassName: homelab-platform-critical
    image:
      repository: harbor.homelab.pastelariadev.com/quay/argoproj/argocd
      tag: v3.5.1@sha256:0deb1a1c917629b960ead995ae3b6069450a866992676599658687ef9a641ee8

  configs:
    params:
      server.insecure: true # TLS at the L4 LB / ingress; don't double-terminate

  dex:
    enabled: false # single operator, local admin

  server:
    ingress:
      enabled: true
      ingressClassName: traefik # existing Nix-deployed ingress-nginx
      hostname: argocd.k8s.pastelariadev.com
    resources:
      requests: { cpu: 10m, memory: 64Mi }

  controller:
    resources:
      requests: { cpu: 25m, memory: 128Mi }
    metrics:
      enabled: true # exposes argocd-application-controller-metrics (:8082) for alloy-metrics

  repoServer:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
    # Keep readiness fast, but do not restart a healthy process during brief
    # node/network stalls. The full liveness check has its own 5s deadline.
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6

  redis:
    image:
      repository: harbor.homelab.pastelariadev.com/dockerhub/library/redis
      tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
    resources:
      requests: { cpu: 10m, memory: 32Mi }

  applicationSet:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

  notifications:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
